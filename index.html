function stats(records=currentRecords()){const n=records.length,right=records.filter(r=>r.ok).length,unique=new Set(records.map(r=>r.qid)).size,hi=records.filter(r=>['고난도','최고난도'].includes(B[r.qid]?.level)),hr=hi.filter(r=>r.ok).length;const today=dateKey(), daily=records.filter(r=>dateKey(r.at)===today);const dayCount=daily.length, dayRight=daily.filter(r=>r.ok).length, examToday=daily.filter(r=>r.examId).length;const exams=state.exams.filter(e=>e.finished), first=Object.values(exams.reduce((o,e)=>{if(!o[e.form]||e.at<o[e.form].at)o[e.form]=e;return o},{}));const xp=new Set(records.filter(r=>r.ok).map(r=>r.qid)).size*10+Math.floor(n/10)*2;return {n,right,unique,rate:ratio(n,BASE),accuracy:ratio(right,n),high:hi.length,hr,highRate:ratio(hr,hi.length),examAvg:first.length?first.reduce((a,e)=>a+e.score/82*100,0)/first.length:null,examCount:first.length,dayCount,dayRight,examToday,xp,level:Math.floor(xp/200)+1}}
function displayStats(){let s=stats();if(signed()&&remote?.stats){const r=remote.stats;s={...s,...r,rate:ratio(r.n,BASE),accuracy:ratio(r.right,r.n),highRate:ratio(r.hr,r.high),level:Math.floor(r.xp/200)+1}}return s}
const TIERS=[['브론즈',0,0,'#b28d69'],['실버',100,0,'#8997ab'],['골드',200,0,'#c7a442'],['플래티넘',400,75,'#399e91'],['다이아몬드',700,80,'#5e9ce0'],['마스터',1000,85,'#9b78c8'],['그랜드마스터',2000,90,'#cd657c'],['챌린저',5000,95,'#d9ae4c']];function tier(s){return [...TIERS].reverse().find(x=>s.rate>=x[1]&&s.accuracy>=x[2])||TIERS[0]}
function head(){const s=displayStats();$('accountBtn').textContent=signed()?state.profile.nickname+' · 계정':'계정 / 연결';$('kpis').innerHTML=[['누적 학습률',pct(s.rate),`${nf(s.n)}회 · ${BASE}회 = 100%`],['전체 정답률',s.n?pct(s.accuracy):'—',`${nf(s.right)} / ${nf(s.n)}문항`],['고난도 정답률',s.high?pct(s.highRate):'—',`${nf(s.high)}문항 풀이`],['내신 평균',s.examAvg===null||s.examAvg===undefined?'—':s.examAvg.toFixed(1)+'점','회차별 첫 응시 · 100점 환산']].map(x=>`<div class="kpi"><small>${H(x[0])}</small><strong>${H(x[1])}</strong><small>${H(x[2])}</small></div>`).join('');$('nav').innerHTML=NAV.map(([id,n,d])=>`<button data-act="nav" data-v="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${n}<small>${d}</small></button>`).join('');document.documentElement.dataset.theme=localPrefs.dark?'dark':'light'}
function go(p){if(!NAV.some(x=>x[0]===p))return;page=p;activeReview=null;render();window.scrollTo({top:0,behavior:'instant'});if(p==='ranking')fetchRank()}
function render(){head();const fn={analysisText:renderText,problem:()=>renderProblem('quiz'),essay:renderEssay,exam:renderExam,analytics:renderAnalytics,ranking:renderRanking,info:renderInfo}[page];$('main').innerHTML=fn()}
const btn=(act,v,txt,cls='btn',extra='')=>`<button type="button" class="${cls}" data-act="${act}" data-v="${H(v)}" ${extra}>${txt}</button>`, sel=(id,options,v)=>`<select id="${id}">${options.map(([a,b])=>`<option value="${H(a)}" ${String(a)===String(v)?'selected':''}>${H(b)}</option>`).join('')}</select>`, field=(label,html)=>`<label class="field">${label}${html}</label>`, card=(inner,cls='')=>`<section class="card ${cls}">${inner}</section>`, table=rows=>`<div class="table-wrap"><table><thead><tr>${rows[0].map(x=>`<th>${H(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>'<tr>'+r.map(x=>`<td>${H(x)}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`, progress=n=>`<div class="progress"><i style="width:${Math.min(100,Math.max(0,n))}%"></i></div>`, topicOptions=[['all','전체 시험 범위'],['3','3단원 전체'],['4','4단원 전체'],['5','5단원 전체'],...Object.entries(TOP).map(([k,v])=>[k,v.name])];
function matches(q,t){return t==='all'||String(q.unit)===t||q.t===t}function levelOrder(q){return ['기본','심화','고난도','최고난도'].indexOf(q.level)}function qStats(id){const a=currentRecords().filter(r=>r.qid===id);return {n:a.length,right:a.filter(r=>r.ok).length,last:a[a.length-1],wrong:a.filter(r=>!r.ok).length}}
function topicProgress(t){let arr=D.questions.filter(q=>q.t===t&&q.mode!=='short');let ids=new Set(currentRecords().filter(r=>B[r.qid].t===t).map(r=>r.qid));return [ids.size,arr.length,ratio(ids.size,arr.length)]}
function diagram(t){if(t==='lag')return `<div class="diagram"><svg viewBox="0 0 360 246" role="img" aria-label="태양 지구 라그랑주점 위치 개념도"><circle cx="165" cy="123" r="98" fill="none" stroke="currentColor" opacity=".25" stroke-dasharray="5 4"/><path d="M67 123 H310 M165 123 L214 38 L263 123 L214 208 Z" stroke="#938acb" stroke-dasharray="5 4" fill="none"/><circle cx="165" cy="123" r="21" fill="#e8b54b"/><text x="165" y="127" text-anchor="middle" font-size="12" fill="#34240b">태양</text><circle cx="263" cy="123" r="10" fill="#5294cc"/><text x="263" y="148" text-anchor="middle" font-size="12" fill="currentColor">지구</text>${[[241,123,'L1'],[291,123,'L2'],[67,123,'L3'],[214,38,'L4'],[214,208,'L5']].map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="6" fill="${i>=3?'#389d85':'#7561b2'}"/><text x="${x[0]}" y="${x[1]-11}" text-anchor="middle" fill="currentColor" font-size="13">${x[2]}</text>`).join('')}</svg><p class="muted">157쪽 기준 자체 제작 개념도 · 실제 거리 비율 아님</p></div>`;if(t==='auto')return `<div class="grid g3">${[['01 인지','전파 · 레이저 · 영상 수집'],['02 판단','영상 분류 · 위치 분석 · 행동 결정'],['03 제어','운전대 · 가속 · 브레이크 조작']].map(x=>`<div class="note"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join('')}</div><p class="formula">거리 = 전파 속도 × 왕복 시간 ÷ 2</p>`;if(t==='clim')return `<h3>에너지별 발전 비중 비교 (교과서 182쪽)</h3>${table([['연도','석탄','LPG','신재생'],['2015','40.0%','22.5%','3.7%'],['2021','34.3%','29.2%','7.5%']])}<p class="muted">비중 자료이며 절대 발전량 비교에는 총발전량이 필요하다. 표의 수치는 교과서 자료를 재구성했다.</p>`;if(t==='mud')return '<div class="grid g3"><div class="note">CO₂ 흡수</div><div class="note">규조류 광합성 → 산소 배출</div><div class="note">탄소 → 생물·갯벌에 저장</div></div>';return ''}
function renderText(){const t=TOP[topic],pr=topicProgress(topic),s=displayStats();let ts=Object.entries(TOP).filter(([k,v])=>unit==='all'||String(v.unit)===unit);if(!ts.some(([k])=>k===topic)){topic=ts[0][0];return renderText()}return card(`<div class="row between"><div><div class="tag">READING · 시험 범위</div><h2 style="margin-top:8px">교과서를 이해하고, 근거로 답하기</h2><p class="muted">3–5단원 지정 지문 · 출제 포인트 · 자체 제작 요약</p></div><div><div class="tag">${H(tier(s)[0])} · Lv.${s.level}</div><p class="tiny">누적 응답 ${nf(s.n)}회</p></div></div><div class="row" style="margin-top:16px">${btn('starttopic',topic,'이 지문 문제 풀기 →','btn primary')}${btn('nav','essay','5단원 논술 대비','btn')}</div>`,'hero')+`<div class="grid g4">${[['all','전체 범위','지문 및 논술 연계 이론'],['3','3단원','논증 · 자기 성찰'],['4','4단원','사회 · 과학 기술'],['5','5단원','환경 · 매체']].map(x=>`<button data-act="unit" data-v="${x[0]}" class="unitcard unit ${x[0]==='4'?'u4':x[0]==='5'?'u5':''} ${unit===x[0]?'active':''}"><strong>${x[1]}</strong><div class="muted">${x[2]}</div></button>`).join('')}</div><div class="topic-list">${ts.map(([k,v])=>{let [a,b,p]=topicProgress(k);return `<button data-act="topic" data-v="${k}" class="topic ${topic===k?'active':''}">${H(v.name)}<small>${H(v.p)}쪽 · ${a}/${b} 고유 학습</small>${progress(p)}</button>`}).join('')}</div>`+card(`<div class="row between subhead"><div><span class="tag">${t.unit}단원 · ${H(t.genre)}</span><h2 style="margin-top:7px">${H(t.name)}</h2><p class="source">교과서 ${H(t.p)}쪽${topic==='media'?' · 논술 예시 시험지의 단원 이론 연계':''}</p></div>${btn('bookmark',topic,state.bookmarks.includes(topic)?'★ 북마크 해제':'☆ 북마크','btn small')}</div><h3>핵심 주제</h3><p style="margin:7px 0 16px">${H(t.theme)}</p><div class="grid g2"><div><h3>문단·내용 구조</h3><div class="steps">${t.structure.map(x=>`<div class="step"><b>${H(x[0])}</b><span>${H(x[1])}</span></div>`).join('')}</div></div><div><h3 style="margin-bottom:9px">핵심 비교표</h3>${table(t.table)}</div></div>${diagram(topic)?'<div class="rule"></div>'+diagram(topic):''}<div class="rule"></div><h3>시험에서 놓치기 쉬운 부분</h3>${t.traps.map(x=>`<p style="margin:8px 0">• ${H(x)}</p>`).join('')}<div class="notice">시험 대비는 교과서 서술 기준. 원문·삽화를 그대로 공개하지 않고 요약 및 재구성 자료를 사용합니다.</div>`)+card(`<div class="row between"><h3>핵심 개념 및 근거 카드</h3><span class="muted">개인 확인 기록 · 공식 정답률 제외</span></div>${t.concepts.length?t.concepts.map((f,i)=>`<details class="detail"><summary>${H(f.k)} · ${H(f.p)}쪽 ${state.concepts[topic+'-'+i]?' ✓':''}</summary><p>${H(f.text)}</p><p class="muted">출제 포인트: ${H(f.why)}</p>${btn('concept',topic+'-'+i,state.concepts[topic+'-'+i]?'확인 취소':'확인 완료','btn small')}</details>`).join(''):'<p class="muted">연결된 개별 지문에서 핵심 개념을 확인하세요.</p>'}`)+card(`<h3>나만의 필기</h3><textarea data-note="${topic}" placeholder="헷갈리는 개념이나 선지, 시험에 나올 만한 포인트를 기록하세요." rows="4">${H(state.notes[topic]||'')}</textarea><p class="muted">이 브라우저에 자동 저장됩니다.</p>`)}
function setupProblem(which){let drill=which==='drill',c=drill?drillConfig:problemConfig,bank=D.questions.filter(q=>q.kind===(drill?'drill':'practice')&&matches(q,c.topic||'all')&&(c.level==='all'||!c.level||q.level===c.level)&&(c.mode==='all'||q.mode===c.mode));if(c.pool==='wrong')bank=bank.filter(q=>{let s=qStats(q.id);return s.last&&(!s.last.ok||s.last.unsure)});if(c.pool==='weak')bank.sort((a,b)=>qStats(b.id).wrong-qStats(a.id).wrong);else bank=shuffle(bank);let ids=bank.slice(0,c.n==='all'?bank.length:Math.min(bank.length,Number(c.n)||20)).map(q=>q.id);if(!ids.length){toast('선택한 조건에 해당하는 문제가 없습니다.');return}state[which]={ids,i:0,answers:{},graded:{},marked:{},started:Date.now(),finished:false};save();render();}
function formConfig(which){let c=which==='drill'?drillConfig:problemConfig,drill=which==='drill';return card(`<div class="section-head"><div><h2>${drill?'단계별 논술 훈련':'문제은행'}</h2><p>${drill?'핵심어 60 · 단문 서술 60 · 논리 조합 30':'OX 90 · 객관식 180 · 근거 40 · 배열 20 · 핵심어 30'}</p></div><span class="tag">${drill?'150':'360'}문항</span></div><div class="grid g${drill?'2':'3'}">${drill?'':field('시험 범위',sel('pc-topic',topicOptions,c.topic))+field('난이도',sel('pc-level',[['all','전체'],['기본','기본'],['심화','심화']],c.level))}${field('유형',sel('pc-mode',drill?[['all','전체'],['fill','핵심어 빈칸'],['short','단문 서술형'],['order','논리 조합']]:[['all','전체'],['ox','OX'],['choice','5지선다'],['evidence','근거 찾기'],['order','논리 배열'],['fill','핵심어']],c.mode))}${field('문항 수',sel('pc-n',[['10','10문항'],['20','20문항'],['40','40문항'],['all','선택 범위 전체']],c.n))}${drill?'':field('학습 방식',sel('pc-pool',[['all','무작위'],['weak','오답 빈도 우선'],['wrong','오답·찍은 문제만']],c.pool))}</div><div class="row" style="margin-top:16px">${btn('startquiz',which,'학습 시작','btn primary')}${!drill?btn('reviewlast','','최근 오답 풀기','btn'):''}</div><p class="source">${drill?'단문 답안은 모범 답안과 비교하며 자기 점검합니다.':'실제 응답과 제출만 누적 학습률 및 정답률에 반영됩니다.'}</p>`)}
function answered(q,a){if(a===undefined||a===null)return false;if(q.mode==='order')return Array.isArray(a)&&a.length===q.opts.length;if(q.mode==='fill'||q.mode==='short')return String(a).trim().length>0;return Number.isInteger(a)&&a>=0&&a<q.opts.length}function correct(q,a){if(!answered(q,a))return false;if(q.mode==='fill')return [q.a,...(q.accept||[])].some(v=>norm(v)===norm(a));if(q.mode==='order')return J(a)===J(q.a);return a===q.a}
function ansText(q,a){if(a===undefined||a===null)return '미응답';if(q.mode==='order')return Array.isArray(a)?a.map(i=>q.opts[i]).join(' → '):'미응답';if(q.mode==='fill'||q.mode==='short')return String(a);return `${['①','②','③','④','⑤'][a]||''} ${q.opts[a]||''}`}
function omr(s){return `<div class="omr">${s.ids.map((id,i)=>{let q=B[id],a=s.answers[id],g=s.graded[id],cl=[i===s.i?'current':'',answered(q,a)?'done':'',s.marked[id]?'marked':'',g?g.ok?'right':'wrong':''].join(' ');return btn('jump',i,i+1,cl,'aria-label="'+(i+1)+'번 문항"')}).join('')}</div>`}
function answerUI(q,a,locked){if(q.mode==='order'){let v=Array.isArray(a)?a:[];return `<div class="answerbox">${v.length?v.map((x,i)=>btn('removeToken',i,H(q.opts[x]),'token',locked?'disabled':'')).join(''):'<span class="muted">아래 항목을 차례로 선택하세요.</span>'}</div><div class="tokens">${q.opts.map((x,i)=>btn('token',i,H(x),'token',locked||v.includes(i)?'disabled':'')).join('')}</div>`}if(q.mode==='fill'||q.mode==='short'){return q.mode==='short'?`<textarea id="answerInput" rows="5" placeholder="핵심 근거를 포함하여 답안을 작성하세요." ${locked?'readonly':''}>${H(a||'')}</textarea>`:`<input id="answerInput" type="text" autocomplete="off" placeholder="핵심어 입력" value="${H(a||'')}" ${locked?'readonly':''}>`}return `<div class="options">${q.opts.map((o,i)=>`<button data-act="choose" data-v="${i}" class="option ${a===i?'chosen':''} ${locked&&i===q.a?'right':''} ${locked&&i===a&&a!==q.a?'wrong':''}" ${locked?'disabled':''}><span class="num">${q.mode==='ox'?o:['①','②','③','④','⑤'][i]}</span><span>${q.mode==='ox'?(i===0?'옳다':'틀리다'):H(o)}</span></button>`).join('')}</div>`}
function feedback(q,g,a){if(q.mode==='short')return `<div class="feedback"><h3>모범 답안 · 자기 점검</h3><p class="essaybody">${H(q.ex)}</p><p class="muted">교과서 ${H(q.p)}쪽 · 서술형은 공식 자동 채점에 포함하지 않습니다.</p><div class="row" style="margin-top:10px">${btn('shortReview','yes','핵심 내용 충족','btn '+(g?.self==='yes'?'primary':''))}${btn('shortReview','no','복습 필요','btn '+(g?.self==='no'?'primary':''))}</div></div>`;return `<div class="feedback"><h3 class="${g.ok?'good':'bad'}">${g.ok?'✓ 정답입니다':'정답을 확인하세요'}</h3><p><b>정답</b> ${H(ansText(q,q.a))}</p><p><b>근거</b> ${H(q.ex)}</p>${q.claims?`<div class="rule"></div><h4>진술별 판단</h4>${q.claims.map(x=>`<div class="why"><strong class="${x.truth?'good':'bad'}">${x.label} ${x.truth?'옳음':'틀림'}</strong> · ${H(x.ex)}</div>`).join('')}`:''}${q.why.length&&q.mode!=='ox'?`<div class="rule"></div><h4>선지별 해설</h4>${q.opts.map((x,i)=>`<div class="why"><b class="${i===q.a?'good':''}">${['①','②','③','④','⑤'][i]}</b> ${H(q.why[i]||q.ex)}</div>`).join('')}`:''}<p class="source">교과서 ${H(q.p)}쪽 · 자체 제작 문제</p></div>`}
function activeKey(){return page==='exam'?'exam':page==='essay'?'drill':'quiz'}function activeSession(){return state[activeKey()]}
function questionView(s,exam=false,review=false){const q=B[s.ids[s.i]],a=s.answers[q.id],g=s.graded[q.id],locked=exam?s.finished:!!g;let stem=`<div class="row between"><span class="tag">${H(q.unit)}단원 · ${H(q.level)} · ${H(q.typ)}</span>${exam?`<span class="tag">${q.points}점</span>`:''}</div><p class="source">${H(TOP[q.t].name)} · 교과서 ${H(q.p)}쪽</p><div class="q-stem">${s.i+1}. ${H(q.stem)}</div>${q.claims?`<div class="claims">${q.claims.map(x=>`<div class="claim"><strong>${x.label}</strong><span>${H(x.text)}</span></div>`).join('')}</div>`:''}`;const passage=q.passage?`<aside class="passage"><h4>${q.case?'보기 · '+H(q.case):'보기'}</h4>${H(q.passage)}<p class="source">${q.case?'가상 자료 · 교과서 개념 적용':'교과서 기반 재구성'}</p></aside>`:'';return `<div class="q-layout ${passage?'':'single'}">${passage}<div class="card"><div class="row between"><span class="muted">${s.i+1} / ${s.ids.length}</span>${btn('mark','',s.marked[q.id]?'★ 검토 표시됨':'☆ 찍었음 / 검토','btn small',s.finished?'disabled':'')}</div>${progress(ratio(Object.keys(s.graded).length,s.ids.length))}${stem}${answerUI(q,a,locked)}${!exam&&!g?`<div class="row between" style="margin-top:14px">${btn('grade','','채점 / 해설 확인','btn primary grow',!answered(q,a)?'disabled':'')}</div>`:''}${g&&(!exam||s.finished)?feedback(q,g,a):''}<div class="rule"></div><div class="row between">${btn('prev','','← 이전','btn',s.i===0?'disabled':'')}${btn('next','',s.i===s.ids.length-1?(exam?'마지막 문항':'학습 결과'):'다음 →','btn primary',exam&&s.i===s.ids.length-1?'disabled':'')}</div></div></div>`}
function renderProblem(which){let s=state[which];if(!s)return formConfig(which);if(s.finished)return resultQuiz(s,which);return card(`<div class="row between"><h3>${which==='drill'?'논술 단계별 훈련':'문제 풀이'}</h3>${btn('quit',which,'나가기 · 이어하기','btn small')}</div>${omr(s)}`)+questionView(s)}
function resultQuiz(s,which){let g=Object.values(s.graded),sc=g.filter(x=>!x.short),r=sc.filter(x=>x.ok).length;return card(`<div class="row between"><h2>학습 결과</h2>${btn('newquiz',which,'새 학습','btn')}</div><div class="score-big">${r} / ${sc.length}</div><p class="muted">채점 가능한 ${sc.length}문항 · 단문 자기평가 ${g.length-sc.length}개</p><div class="grid g3" style="margin-top:12px"><div class="note">정답률<div class="metric">${pct(ratio(r,sc.length))}</div></div><div class="note">완료<div class="metric">${g.length}/${s.ids.length}</div></div><div class="note">검토 표시<div class="metric">${Object.keys(s.marked).length}</div></div></div><div class="row" style="margin-top:15px">${btn('retrywrong',which,'오답·찍은 문제 다시 풀기','btn primary')}${btn('reviewQuiz',which,'문제별 결과 보기','btn')}</div>${activeReview===which?`<div class="rule"></div>${omr(s)}${questionView(s,false,true)}`:''}`)}
function record(q,a,unsure,examId=null,id=null){if(q.mode==='short'||!answered(q,a))return null;let r={id:id||uuid(),qid:q.id,a,ok:correct(q,a),unsure:!!unsure,at:Date.now(),examId};if(state.records.some(x=>x.id===r.id))return r;state.records.push(r);if(signed()&&!examId)state.pending.push({type:'item',id:r.id,qid:q.id,answer:a,unsure:r.unsure});return r}
function gradeCurrent(){let s=activeSession(),q=B[s.ids[s.i]],a=s.answers[q.id];if(s.graded[q.id]||!answered(q,a))return;if(q.mode==='short'){s.graded[q.id]={short:true,ok:false};state.shorts[q.id]={answer:a,at:Date.now(),self:null}}else{let r=record(q,a,s.marked[q.id]);s.graded[q.id]={ok:r.ok}}save();render();flush()}
function examCard(i){let ex=state.exams.filter(x=>x.form===i+1),s=ex.length?ex[ex.length-1]:null;return `<div class="card tight"><div class="row between"><span class="tag">MOCK ${String(i+1).padStart(2,'0')}</span><span class="muted">25문항</span></div><h3 style="margin:8px 0">${i+1}회 · 실전 내신</h3><p class="muted">기본 5 · 심화 5 · 고난도 10 · 최고난도 5</p><p class="source">${s?'최근 객관식 '+s.score+'/82점':'아직 응시하지 않음'} · 18점 논술 연계</p>${btn('startexam',i+1,s?'다시 응시':'시험 시작','btn full primary')}</div>`}
function renderExam(){let s=state.exam;if(!s)return card(`<div class="section-head"><div><h2>내신 예상 · 고난도 모의고사</h2><p>고2 학력평가형 사고 과정 참고 · 교과서 기반 자체 제작</p></div><span class="tag">고난도 이상 60%</span></div><div class="grid g3"><div class="note">객관식<div class="metric">25문항 · 82점</div></div><div class="note">논술 연계<div class="metric">1세트 · 18점</div></div><div class="note">시험 시간<div class="metric">50분 권장</div></div></div><p class="muted" style="margin-top:12px">객관식 시험 타이머 50분(논술은 별도 작성). 공식 랭킹은 회차별 첫 응시 객관식 점수를 100점 환산하여 평균합니다. 설계 난이도는 응시 통계로 검증되지 않았습니다.</p>`)+`<div class="grid g2">${D.exams.map((_,i)=>examCard(i)).join('')}</div>`;if(s.finished){let r=state.exams.find(x=>x.id===s.id);return card(`<div class="row between"><h2>${s.form}회 시험 결과</h2>${btn('newexam','','시험 목록','btn')}</div><div class="row between"><div><div class="score-big">${r?.score||0} / 82점</div><div class="muted">객관식 · 100점 환산 ${ratio(r?.score||0,82).toFixed(1)}점</div></div><span class="tag">${r?.right||0}/25 정답</span></div><p class="notice">논술 18점은 별도 자기 채점으로 평가합니다. 미응답은 객관식에서 0점이며 누적 학습률에는 포함하지 않습니다.</p><div class="row" style="margin:14px 0">${btn('examEssay',Math.min(11,s.form-1),'연계 논술 작성','btn primary')}${btn('examReview','','해설 · 오답 확인','btn')}${btn('print','','인쇄','btn')}</div>${omr(s)}`)+(activeReview==='exam'?questionView(s,true,true):'')}
return card(`<div class="row between"><div><h3>${s.form}회 · 실전 시험</h3><span class="muted">정답과 해설은 최종 제출 후 공개</span></div><div class="timer" id="timer">--:--</div></div>${omr(s)}<div class="row between" style="margin-top:12px"><span class="muted">응답 ${s.ids.filter(id=>answered(B[id],s.answers[id])).length}/25 · 검토 ${Object.keys(s.marked).length}</span>${btn('submitexam','','최종 제출','btn primary')}${btn('quitexam','','나가기 · 이어하기','btn small')}</div>`)+questionView(s,true)}
function startExam(n){if(state.exam&&!state.exam.finished){toast('진행 중인 시험을 먼저 제출하거나 계속 풀어 주세요.');return}state.exam={id:uuid(),form:n,ids:D.exams[n-1],i:0,answers:{},graded:{},marked:{},started:Date.now(),deadline:Date.now()+50*60*1000,finished:false};save();render()}
function submitExam(force=false){let s=state.exam;if(!s||s.finished)return;let missing=s.ids.filter(id=>!answered(B[id],s.answers[id])).length;if(!force&&!confirm(`${missing}개 미응답 문항이 있습니다. 시험을 최종 제출하시겠습니까?`))return;let score=0,right=0,items=[];for(let id of s.ids){let q=B[id],a=s.answers[id],ok=correct(q,a);s.graded[id]={ok};if(ok){score+=q.points;right++}if(answered(q,a)){const r=record(q,a,s.marked[id],s.id,s.id+':'+id);items.push({id:r.id,qid:id,answer:a,unsure:!!s.marked[id]})}}let e={id:s.id,form:s.form,score,right,at:Date.now(),finished:true};state.exams.push(e);s.finished=true;if(signed())state.pending.push({type:'exam',id:s.id,form:s.form,items});save();activeReview=null;render();flush();if(force)toast('시험 시간이 종료되어 자동 제출했습니다.')}
setInterval(()=>{let s=state.exam;if(!s||s.finished)return;let ms=s.deadline-Date.now();if(ms<=0){submitExam(true);return}if(page==='exam'&&$('timer')){$('timer').textContent=`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`}},500);
function essayEntry(e){return state.essayDrafts[e.id]||{answer:'',checks:{},termCheck:false,show:false,at:null}}
function essayCount(txt){return Array.from(txt||'').length}function essayTerms(e,a){return e.terms.filter(t=>norm(a).includes(norm(t)))}function essayScore(e,d){return Object.values(d.checks||{}).filter(Boolean).length+((d.termCheck&&essayCount(d.answer)>=600&&essayCount(d.answer)<=800&&essayTerms(e,d.answer).length>=4)?2:0)}
function renderEssay(){let top=card(`<div class="section-head"><div><h2>논술 LAB · 5단원</h2><p>(가)·(나)·(다)와 매체 이론 · 700자 내외 · 18점</p></div><span class="tag">실전 12세트</span></div><div class="pillbar">${[['sets','실전 논술'],['drills','단계별 150문항'],['builder','논술 문단 만들기']].map(([a,b])=>btn('essayTab',a,b,'pill '+(essayTab===a?'active':''))).join('')}</div><div class="notice">예시 시험지의 4+4+4+4+2점 조건 형식. 핵심어·분량 검사는 보조 기능이며 내용 채점은 모범 답안과 비교하여 직접 점검합니다.</div>`);if(essayTab==='drills')return top+renderProblem('drill');if(essayTab==='builder')return top+renderBuilder();let e=D.essays[selectedEssay],d=essayEntry(e),count=essayCount(d.answer),terms=essayTerms(e,d.answer);return top+card(`<div class="row between"><h3>논술 세트 선택</h3><span class="muted">저장 답안 ${Object.values(state.essayDrafts).filter(x=>x.answer?.trim()).length}/12</span></div><div class="grid g3" style="margin-top:12px">${D.essays.map((x,i)=>`<button data-act="essaySelect" data-v="${i}" class="topic ${i===selectedEssay?'active':''}"><span class="tag">${String(i+1).padStart(2,'0')}</span> ${H(x.title)}<small>${state.essayDrafts[x.id]?.answer?'작성 기록 있음':'미작성'}</small></button>`).join('')}</div>`)+card(`<div class="row between"><div><p class="muted">논술형 예상 평가 · ${selectedEssay+1}회</p><h2>${H(e.title)}</h2></div>${btn('print','','인쇄','btn small')}</div><div class="rule"></div><p><strong>[논술형 문항] (18점)</strong></p><p>${H(e.intro)} 교과서 제시문과 단원 이론을 바탕으로 다음 보기의 타당성과 한계를 평가하고 개선 방안을 논술하시오.</p><div style="margin:14px 0">${table([['구분','기획안·정책 초안'],...e.blocks.map(b=>[b.label,b.proposal])])}</div><h3>조건</h3>${e.blocks.map((b,i)=>`<p style="margin:10px 0"><b>${i+1}. </b>${H(b.task)} (4점)</p>`).join('')}<p style="margin:10px 0"><b>5. </b>아래 핵심 용어 중 4개 이상을 정확히 사용하여 공백 포함 700자 내외(±100자)의 완결된 글을 작성할 것. (2점)</p><div class="note">${e.terms.map(H).join(' · ')}</div><p class="source">교과서 근거: ${[...new Set(e.blocks.map(b=>b.p))].map(H).join(' / ')}쪽 · 자체 제작 예상 평가</p>`)+card(`<div class="row between"><h3>답안 작성</h3><span class="tag" id="essayChars">${count}자 / 600~800자</span></div><textarea rows="12" id="essayInput" placeholder="조건별로 문단을 나누어 작성하세요. 입력 내용은 자동 저장됩니다.">${H(d.answer)}</textarea><div class="row between"><span class="muted" id="essayTermStatus">핵심 용어 ${terms.length}개 발견 (4개 이상 권장)</span>${btn('saveessay','','답안 저장 · 점검','btn primary')}${btn('showessay','',d.show?'모범 답안 접기':'모범 답안 및 채점 기준','btn')}</div><p class="source">문자열 포함 여부만 검사하며 용어를 정확히 사용했는지 자동 판단하지 않습니다.</p>${d.show?`<div class="rule"></div><h3>모범 답안 <span class="muted">${essayCount(e.answer)}자 · 예시</span></h3><div class="essaybody" style="margin:10px 0">${H(e.answer)}</div><div class="rule"></div><div class="row between"><h3>조건별 자기 채점</h3><div class="metric" id="essayScore">${essayScore(e,d)}/18점</div></div>${e.blocks.map((b,i)=>`<div class="detail"><h4>조건 ${i+1}. ${H(b.label)} (4점)</h4><div class="criteria">${b.criteria.map((c,j)=>`<label><input type="checkbox" data-criterion="${i}-${j}" ${d.checks?.[i+'-'+j]?'checked':''}><span>${H(c.text)} (1점)</span></label>`).join('')}</div><p class="muted">교과서 ${H(b.p)}쪽</p></div>`).join('')}<label><input type="checkbox" id="essayTermCheck" ${d.termCheck?'checked':''}> 핵심 용어를 정확히 사용하고 분량 및 완결된 문장 조건을 충족함 (2점)</label><p class="notice">자기 채점은 공식 랭킹과 별개입니다. 표시된 핵심어만으로 내용의 타당성이 확인되는 것은 아닙니다.</p>`:''}`)}

중국어 사이트에서 사용하는 동일 Supabase 계정이라면 그대로 로그인할 수 있습니다. 중국어 학습 기록은 가져오지 않습니다.</p>`}<div id="authMsg" class="muted"></div>`)+card(`<h3>스터디 그룹</h3>${signed()?`<div class="stack">${(remote?.groups||[]).map(g=>`<div class="note"><div class="row between"><b>${H(g.name)}</b><span class="tag">${H(g.code)}</span></div><div class="row">${btn('invite',g.code,'초대 링크 복사','btn small')}${btn('leaveGroup',g.id,'그룹 나가기','btn small')}</div></div>`).join('')}</div><div class="grid g2" style="margin-top:12px">${field('그룹 이름','<input id="groupName" maxlength="30" placeholder="예: 독서와 작문 스터디">')}${field('초대 코드','<input id="joinCode" placeholder="코드 입력">')}</div><div class="row">${btn('createGroup','','그룹 생성','btn')}${btn('joinGroup','','그룹 가입','btn')}</div><p class="source">그룹에 가입한 사람들의 누적 학습 기록을 랭킹에서 비교합니다.</p>`:'<p class="muted">로그인 후 그룹 생성 및 가입이 가능합니다.</p>'}`)+card(`<h3>기록 관리</h3><div class="row">${btn('export','','개인 기록 내보내기','btn')}${btn('import','','개인 기록 가져오기','btn')}${btn('reset','','개인 기록 초기화','btn danger')}</div><input hidden id="importFile" type="file" accept="application/json,.json"><p class="source">가져온 기록은 개인 복습 전용이며 공식 랭킹에 소급되지 않습니다. 서버 기록은 초기화하지 않습니다.</p>`)+card(`<details class="detail" ${localPrefs.setup?'open':''}><summary>운영자: Supabase 온라인 랭킹 연결</summary><p class="notice">새 국어 사이트용 초기화입니다. 기존 중국어 스키마를 변경하지 않습니다. 1~${SQL.length} 단계 순서대로 새 SQL Editor에서 실행하고, 마지막 결과를 확인하세요.</p><div class="stack" style="margin:10px 0">${SQL.map((x,i)=>`<div class="row between"><span>${i+1}. ${H(x.title)} <small>(${nf(x.sql.length)}자)</small></span>${btn('copySQL',i,'SQL 복사','btn small')}${btn('viewSQL',i,'보기','btn small')}</div>`).join('')}</div><textarea id="sqlView" rows="6" hidden readonly></textarea><p class="muted">Supabase Authentication → URL Configuration에서 국어 사이트 주소를 Redirect URLs에 추가. 기존 중국어 사이트 설정은 유지하세요.</p><div class="grid g2">${field('Project URL',`<input id="cfgUrl" value="${H(CFG.url)}" placeholder="https://...supabase.co">`)}${field('공개 키 (publishable / anon)',`<input id="cfgKey" value="${H(CFG.key)}" autocomplete="off" placeholder="sb_publishable_...">`)}</div><div class="rule"></div><label class="field">기존 중국어 HTML에서 연결 정보 가져오기<input type="file" id="oldConfig" accept=".html,text/html"></label><label class="field">국어 원본 HTML 파일 선택 (로컬에서 설정 파일 생성 시 필수)<input type="file" id="originalHtml" accept=".html,text/html"></label><div class="row" style="margin-top:10px">${btn('makeConfig','','연결된 index.html 생성','btn primary')}${btn('downloadSql','','전체 SQL 다운로드','btn')}</div><p class="source">비밀 키 또는 service_role 키를 입력하지 마세요. 서버 함수는 인증된 계정의 답안을 채점하지만 HTML 정답 공개로 완전한 부정 방지는 불가능합니다. 실제 Supabase 실행 후 로그인·랭킹 테스트가 필요합니다.</p></details><p class="source">배포: GitHub의 별도 국어 저장소에 index.html 하나 업로드 → Render Static Site, Publish Directory: .</p><p class="source">출제 범위: 3단원 90~93, 102~104쪽 · 4단원 138, 156~159, 164~167쪽 · 5단원 180~186쪽 + 논술 연계 178쪽 이론. 시험 예시 및 개념 정리를 반영한 자체 제작.</p>`)}
// Supabase REST: authenticated scoring, no privileged key in browser.
async function request(path,opts={},token=auth?.access_token){let headers={'apikey':CFG.key,'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;let res=await fetch(CFG.url.replace(/\/$/,'')+path,{...opts,headers});let body=await res.text();let data;try{data=JSON.parse(body)}catch{data=body}if(!res.ok)throw Error(data?.msg||data?.message||data?.error_description||data?.error||`HTTP ${res.status}`);return data}
async function refreshAuth(){if(!auth?.refresh_token)return false;try{let a=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:J({refresh_token:auth.refresh_token})},null);if(a.access_token){auth={...a,user:a.user||auth.user};write('auth',auth);return true}}catch{}return false}
async function rpc(name,args={}){if(!isConfigured()||!signed())throw Error('온라인 연결 및 로그인이 필요합니다.');if(auth.expires_at&&auth.expires_at<Date.now()/1000+60)await refreshAuth();try{return await request('/rest/v1/rpc/kl1_'+name,{method:'POST',body:J(args)})}catch(e){if(/jwt expired|JWT expired|token is expired/i.test(e.message)&&await refreshAuth())return request('/rest/v1/rpc/kl1_'+name,{method:'POST',body:J(args)});throw e}}
function switchAccount(a){auth=a;write('auth',auth);accountId=a?.user?.id||'guest';loadState();save();render()}
async function login(signup=false){if(busy)return;const email=$('email')?.value.trim(),password=$('password')?.value;if(!email||!password||password.length<8){toast('이메일과 8자 이상 비밀번호를 입력하세요.');return}busy=true;try{let path=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';if(signup&&location.protocol.startsWith('http'))path+='?redirect_to='+encodeURIComponent(location.origin+location.pathname);let a=await request(path,{method:'POST',body:J({email,password})},null);if(!a.access_token){toast('가입 확인 메일을 확인한 뒤 로그인해 주세요.');return}switchAccount(a);await initOnline();toast('로그인되었습니다.')}catch(e){toast('계정 연결: '+e.message)}finally{busy=false}}
async function initOnline(){if(!signed())return;try{let r=await rpc('me');remote=r;if(r.profile){state.profile={...state.profile,...r.profile};save()}else{await rpc('profile',{p_nickname:state.profile.nickname==='학습자'?'학습자 '+accountId.slice(0,5):state.profile.nickname,p_avatar:state.profile.avatar,p_title:state.profile.title});await fetchMe()}await fetchMe();await flush();if(page==='ranking')fetchRank();else if(page==='info'||page==='analytics'||page==='analysisText')render();else head()}catch(e){toast('서버 연결을 확인하세요: '+e.message);head()}}
async function fetchMe(){let aid=accountId;let r=await rpc('me');if(aid!==accountId)return;remote=r;if(r.profile)state.profile={...state.profile,...r.profile};let m=new Map(state.records.map(x=>[x.id,x]));for(let x of (r.records||[])){m.set(x.id,{...x,at:typeof x.at==='number'?x.at:new Date(x.at).getTime()})}state.records=[...m.values()].sort((a,b)=>a.at-b.at);let e=new Map(state.exams.map(x=>[x.id,x]));for(let x of (r.exams||[]))e.set(x.id,{...x,at:typeof x.at==='number'?x.at:new Date(x.at).getTime(),finished:true});state.exams=[...e.values()];save();head()}
async function flush(){if(syncing||!signed()||!isConfigured()||!state.pending.length)return;syncing=true;let aid=accountId;try{while(state.pending.length&&aid===accountId){let pending=state.pending[0];if(pending.type==='exam'){await rpc('exam',{p_id:pending.id,p_form:pending.form,p_items:pending.items});if(aid!==accountId)break;state.pending=state.pending.filter(x=>x.id!==pending.id)}else{let items=state.pending.filter(x=>x.type==='item').slice(0,70);await rpc('record',{p_items:items.map(({id,qid,answer,unsure})=>({id,qid,answer,unsure}))});if(aid!==accountId)break;let sent=new Set(items.map(x=>x.id));state.pending=state.pending.filter(x=>!sent.has(x.id))}save()}if(aid===accountId){await fetchMe();if(page==='ranking')await fetchRank();else if(page==='info'||page==='analytics')render();else head()}}catch(e){if(aid===accountId)toast('동기화 대기 중: '+e.message)}finally{syncing=false}}
async function fetchRank(){if(!signed()||!isConfigured()){rankRows=[];rankError='';if(page==='ranking')render();return}rankRows=null;rankError='';if(page==='ranking')render();let group=rankGroup,per=rankPeriod;try{let rows=await rpc('board',{p_period:per,p_group:group||null});if(group!==rankGroup||per!==rankPeriod)return;rankRows=rows||[]}catch(e){rankError='공동 랭킹 연결 실패: '+e.message;rankRows=[]}if(page==='ranking')render()}
async function handleRedirect(){let hash=new URLSearchParams(location.hash.slice(1));if(!isConfigured()||!hash.get('access_token'))return;try{let a={access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+Number(hash.get('expires_in')||3600)};a.user=await request('/auth/v1/user',{method:'GET'},a.access_token);history.replaceState(null,'',location.pathname+location.search);switchAccount(a)}catch(e){toast('인증 링크 확인 실패: '+e.message)}}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('복사했습니다.')}catch{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.left='-9999px';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();if(ok)toast('복사했습니다.');else{let v=$('sqlView');if(v){v.hidden=false;v.value=s;v.focus();v.select();toast('자동 복사가 제한됩니다. 선택된 내용을 직접 복사하세요.')}else toast('이 브라우저에서 자동 복사가 제한됩니다.')}}}
function download(name,body,type='text/plain'){let u=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function isPublicKey(k){if(k.startsWith('sb_publishable_'))return true;if(k.startsWith('sb_secret_'))return false;try{let p=k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');let z=JSON.parse(atob(p));return z.role==='anon'}catch{return false}}
async function makeConfig(){let url=$('cfgUrl').value.trim().replace(/\/$/,''),key=$('cfgKey').value.trim();if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)||!isPublicKey(key)){toast('Supabase 프로젝트 URL과 publishable/anon 공개 키를 확인하세요. 비밀 키는 사용할 수 없습니다.');return}let file=$('originalHtml').files[0],src;try{if(file)src=await file.text();else if(location.protocol.startsWith('http'))src=await (await fetch(location.href,{cache:'no-store'})).text();else throw Error('국어 원본 HTML 파일을 선택하세요.');if(!src.includes('id="kl-config"')||!src.includes('id="kl-data"'))throw Error('국어 원본 HTML을 선택하세요.');let config=J({url,key}).replace(/</g,'\\u003c');src=src.replace(/(<script type="application\/json" id="kl-config">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+config+b);download('index.html',src,'text/html;charset=utf-8');toast('연결된 국어 index.html을 생성했습니다.')}catch(e){toast(e.message)}}
function reviewIds(ids){if(!ids.length){toast('복습할 문항이 없습니다.');return}state.quiz={ids,i:0,answers:{},graded:{},marked:{},started:Date.now(),finished:false,review:true};page='problem';save();render();window.scrollTo(0,0)}
function lastWrong(){let m=new Map;for(let r of currentRecords())if(!m.has(r.qid)||m.get(r.qid).at<=r.at)m.set(r.qid,r);return [...m.values()].filter(x=>!x.ok||x.unsure).sort((a,b)=>qStats(b.qid).wrong-qStats(a.qid).wrong).map(x=>x.qid)}
// Exam reviews count as practice, not an official exam run (server distinguishes source).
$('accountBtn').onclick=()=>go('info');$('themeBtn').onclick=()=>{localPrefs.dark=!localPrefs.dark;write('ui',localPrefs);head()};

function studioHTML(){return `<div id="studio" style="margin-top:14px"><div class="notice">기존 650문항의 공식 랭킹과 계정은 그대로 유지됩니다. 추가 팩의 문제·시험·논술은 개인 기록으로 저장됩니다. 공개용 HTML을 생성해 배포하면 다른 사용자도 같은 추가 자료를 볼 수 있습니다. AI 초안은 반드시 검토하세요.</div><h3 style="margin-top:16px">1. 시험 범위 / 예시 자료 등록</h3><div class="grid g3">${field('범위 이름',xinput('title','예: 2학기 기말 2단원'))}${field('단원 번호',xinput('unit','1~30','number'))}${field('출처·페이지',xinput('source','예: 교과서 52~60쪽'))}</div><label class="field">자료 파일 선택 (PDF · 사진 · TXT/MD · JSON)<input type="file" id="xfiles" accept=".pdf,.jpg,.jpeg,.png,.webp,.txt,.md,.json,application/pdf,image/jpeg,image/png,image/webp,text/plain,application/json" multiple></label><div id="xfilelist">${studioFiles.map((f,i)=>`<div class="row between"><span>${H(f.name)} · ${Math.ceil(f.size/1024)}KB</span>${xbtn('removeFile','제거','btn small',i)}</div>`).join('')}</div><p class="source">텍스트 파일은 아래 범위에 읽어들입니다. PDF는 선택 페이지 텍스트 추출 또는 AI 자료로 사용할 수 있습니다. 스캔 PDF·사진은 AI 연동이나 직접 텍스트 입력이 필요합니다. JSON은 학습팩 미리보기에 사용할 수 있습니다.</p><div class="row">${field('PDF 시작 페이지',xinput('from','1','number'))}${field('끝 페이지',xinput('to','최대 30페이지','number'))}${xbtn('pdfText','PDF 텍스트 추출','btn')}</div>${field('시험 범위·지문 요약 / 출제 근거',xarea('scope','교과서 요약, 지문 내용, 출제 범위 등을 입력하거나 파일에서 가져오세요.',6))}${field('시험지 형식 / 출제 요구',xarea('style','예: 보기 적용 60%, 5지선다, 조건 4+4+4+4+2점 논술, 최고난도 비중 등',4))}<div class="grid g3">${field('문항 수',xselect('count',[['5','5문항'],['10','10문항'],['15','15문항'],['25','25문항'],['40','40문항']]))}${field('고난도 이상 목표 비율',xselect('high',[['50','50%'],['60','60%'],['70','70%'],['80','80%']]))}${field('출제 대상',xselect('kind',[['both','일반 + 내신 예상'],['exam','내신 예상'],['practice','일반 문제'],['essay','18점 논술']]))}</div><h3 style="margin-top:16px">2. 학습팩 만들기</h3><p class="muted">자동 AI 출제는 선택 기능입니다. 연결하지 않아도 직접 작성 또는 ChatGPT JSON 가져오기를 사용할 수 있습니다.</p><div class="row">${xbtn('prompt','ChatGPT용 출제 요청문 복사','btn primary')}${xbtn('ai','AI 자동 초안 생성','btn')}${xbtn('template','JSON 예시 양식','btn')}</div><p class="source" function previewHTML(){if(!studioPreview)return '';let p=studioPreview,n=p.questions.length,hi=p.questions.filter(q=>['고난도','최고난도'].includes(q.level)).length;return `<div class="note" style="margin:12px 0"><h3>${H(p.title)}</h3><p>${H(p.source)} · 개념 ${p.concepts.length} · 문제 ${n} · 논술 ${p.essays.length} · 고난도 이상 ${pct(ratio(hi,n))}</p><p>${H(p.summary)}</p>${p.concepts.map(c=>`<details><summary>${H(c.term)}</summary>${H(c.definition)}<small> · ${H(c.source)}</small></details>`).join('')}${p.questions.map((q,i)=>`<details class="detail"><summary>${i+1}. ${H(q.stem)} · ${H(q.level)}</summary><p>${H(q.passage)}</p>${q.options.map((o,j)=>`<p>${j+1}. ${H(o)} ${H(q.optionExplanations[j]||'')}</p>`).join('')}<p><b>정답</b> ${H(q.mode==='fill'?q.answer:q.mode==='order'?q.answer.map(i=>q.options[i]).join(' → '):q.options[q.answer])}</p><p>${H(q.explanation)} · ${H(q.source)}</p></details>`).join('')}${p.essays.map(e=>`<details class="detail"><summary>논술 · ${H(e.title)}</summary><p>${H(e.intro)}</p>${e.blocks.map(b=>`<p>${H(b.proposal)} / ${H(b.task)} / ${H(b.criteria.map(c=>c.text).join(', '))}</p>`).join('')}<p>${H(e.answer)}</p></details>`).join('')}<label style="display:block;margin:12px 0"><input type="checkbox" id="xReviewed"> 출처, 정답, 선지 해설과 논술 조건을 검토했으며 이 자료를 등록합니다.</label>${xbtn('approve','검토 완료 · 학습팩 등록','btn primary')}</div>`}

function xtemplate(){return {version:1,title:studioDraft.title||'새 시험 범위',unit:Number(studioDraft.unit)||5,source:studioDraft.source||'교과서 186쪽',summary:'범위의 핵심 내용을 직접 작성하세요.',concepts:[{term:'핵심 개념',definition:'정확한 정의',source:'출처 페이지'}],questions:[{kind:'practice',mode:'choice',level:'고난도',type:'보기 적용',stem:'문제 내용',passage:'새로운 상황이나 자료',options:['선지 1','선지 2','선지 3','선지 4','선지 5'],answer:0,explanation:'정답의 근거',optionExplanations:['정답 근거','오답 근거 2','오답 근거 3','오답 근거 4','오답 근거 5'],source:'출처 페이지',points:4}],essays:[]}}
function promptText(){return `국어 내신 STUDY LEAGUE용 JSON 학습팩을 만들어 줘. 아래 자료와 첨부 파일만 근거로 사용하고 범위를 추측하지 마. 저작권 있는 원문을 길게 복제하지 말고 자체 제작 요약과 변형 문제를 작성해. 모호하거나 자료가 부족하면 질문하거나 생략하고 출처를 명확히 표시해.\n범위: ${studioDraft.title}\n단원: ${studioDraft.unit}\n출처: ${studioDraft.source}\n문항수: ${studioDraft.count}, 대상: ${studioDraft.kind}, 고난도 이상 목표 ${studioDraft.high}% (자료가 충분할 때).\n시험 형식 요구: ${studioDraft.style}\n시험 자료: ${studioDraft.scope}\n파일 목록(실제 파일을 별도로 첨부해야 함): ${studioFiles.map(f=>f.name).join(', ')}\nJSON 객체만 반환. version:1, title, unit(정수), source, summary, concepts:[{term,definition,source}], questions:[{kind:'practice' 또는 'exam',mode:'choice',level:'기본'|'심화'|'고난도'|'최고난도',type,stem,passage,options:[5개],answer:0~4,explanation,optionExplanations:[5개],source,points:1~20}], essays:[]. 5지선다 단일정답, 오답 선지별 상세 해설, 지문과 보기만으로 답할 수 있게 작성. 난이도는 실제 추론 단계로 설정하고 정답 위치를 고르게 배치. 시험용 문항 kind='exam'. 일반 문항 kind='practice'. 논술은 essays:[{title,intro,terms:[4개 이상],answer:'600~800자 모범 답안',blocks:[{label,proposal,task,source,criteria:[1점 기준 4개 문자열]}를 4개]}] 형식, 18점(4+4+4+4+2) 기준. 논술 요구가 없다면 essays를 빈 배열로 두어도 됨. 자료가 부족하면 허구를 만들지 말고 그 이유를 summary에 적어.`}
function xlocal(make){let r={version:1,title:studioDraft.title,unit:Number(studioDraft.unit),source:studioDraft.source,summary:studioDraft.scope,concepts:[],questions:[],essays:[]};for(let line of studioDraft.concepts.split('\n').filter(x=>x.trim())){let i=line.indexOf('|');need(i>0,'개념은 한 줄에 용어 | 설명 형식으로 입력하세요.');let term=line.slice(0,i).trim(),definition=line.slice(i+1).trim();r.concepts.push({term,definition,source:r.source});if(make)r.questions.push({kind:'practice',mode:'fill',level:'기본',type:'핵심어',stem:definition+' — 이에 해당하는 핵심 용어는?',answer:term,explanation:definition,source:r.source})}if(make)need(r.questions.length,'먼저 개념을 입력하세요.');setJSON(JSON.stringify(xvalidate(r),null,2));xmessage('초안을 만들었습니다. 검증 / 미리보기를 눌러 확인하세요.')}
async function pdfText(){let f=studioFiles.find(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');need(f,'PDF 파일을 선택하세요.');need(!studioBusy,'이미 자료를 읽는 중입니다.');studioBusy=true;try{xmessage('PDF 읽기 중 · 인터넷 연결 필요');let lib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';let doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;try{let from=Math.max(1,Number(studioDraft.from)||1),to=Math.min(doc.numPages,Number(studioDraft.to)||Math.min(doc.numPages,from+9));need(Number.isInteger(from)&&Number.isInteger(to)&&from<=to&&to-from<30,'PDF 페이지는 올바른 범위로, 한 번에 최대 30페이지');let parts=[];for(let i=from;i<=to;i++){let p=await doc.getPage(i),t=await p.getTextContent();parts.push(`[PDF ${i}쪽]\n`+t.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join(''))}let out=parts.join('\n\n');need(out.replace(/\[PDF \d+쪽\]/g,'').trim().length>10,'텍스트가 거의 없습니다. 스캔 PDF는 AI 분석 또는 직접 입력을 사용하세요.');studioDraft.scope=[studioDraft.scope,out].filter(Boolean).join('\n\n');document.querySelector('[data-xfield=scope]').value=studioDraft.scope;xmessage(`${from}~${to}페이지 텍스트를 읽었습니다. 문단 순서와 그림/표는 원본과 대조하세요.`)}finally{await doc.destroy()}}finally{studioBusy=false}}
async function aiDraft(){need(isConfigured()&&signed(),'AI 자동 출제에는 Supabase 연결 및 운영자 로그인이 필요합니다.');need(!studioBusy,'이미 생성 중입니다.');need(studioDraft.title&&studioDraft.source,'범위 이름과 출처를 먼저 입력하세요.');need(studioDraft.scope.trim()||studioFiles.length,'출제 근거를 입력하거나 파일을 선택하세요.');let files=studioFiles.filter(f=>/\.(pdf|png|jpe?g|webp)$/i.test(f.name));need(files.length<=4&&files.reduce((n,f)=>n+f.size,0)<=12*1024*1024,'AI에 보내는 PDF/사진은 최대 4개, 총 12MB입니다. 큰 PDF는 필요한 페이지만 추출하세요.');if(!confirm('입력한 시험 범위 및 선택한 PDF/사진을 AI 서비스에 보내 초안을 생성합니다. API 사용료가 발생할 수 있습니다. 개인정보·공개 권한이 없는 자료는 보내지 마세요. 진행할까요?'))return;studioBusy=true;let aid=accountId;try{xmessage('AI 초안 생성 중… 화면을 유지하세요.');if(auth.expires_at&&auth.expires_at<Date.now()/1000+60)await refreshAuth();let fd=new FormData();fd.append('prompt',promptText());for(let f of files)fd.append('files',f,f.name);let res=await fetch(CFG.url.replace(/\/$/,'')+'/functions/v1/korean-generate',{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+auth.access_token},body:fd});let body=await res.json();if(!res.ok)throw Error(body.error||body.message||'AI 함수 연결 실패');if(aid!==accountId)throw Error('계정이 변경되어 초안을 표시하지 않습니다.');let p=xvalidate(body.pack);setJSON(JSON.stringify(p,null,2));studioPreview=p;if($('xpreview'))$('xpreview').innerHTML=previewHTML();xmessage('AI 초안이 생성되었습니다. 정답과 출처를 반드시 검토하세요.')}finally{studioBusy=false}}
async function xpublish(){let src,f=$('xOriginal')?.files[0];if(f)src=await f.text();else if(location.protocol.startsWith('http')){let res=await fetch(location.href,{cache:'no-store'});need(res.ok,'현재 HTML을 읽을 수 없습니다. 원본 파일을 선택하세요.');src=await res.text()}else throw Error('원본 1.1 HTML을 선택하세요.');need(src.includes('id="kl-packs"'),'국어 1.1 원본 HTML이 필요합니다.');let data=J(packs.map(x=>x.data)).replace(/</g,'\\u003c');src=src.replace(/(<script type="application\/json" id="kl-packs">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+data+b);let cfg=J(CFG).replace(/</g,'\\u003c');if(isConfigured())src=src.replace(/(<script type="application\/json" id="kl-config">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+cfg+b);download('index.html',src,'text/html;charset=utf-8');xmessage('추가 학습팩을 내장한 index.html을 생성했습니다. GitHub에 교체 업로드하세요.')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;let b=$('installTop');if(b)b.textContent='↓ 앱 설치'});window.addEventListener('appinstalled',()=>{installEvent=null;toast('앱 설치가 완료되었습니다.')});
async function xinstall(){if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){toast('이미 앱 모드에서 실행 중입니다.');return}if(installEvent){let e=installEvent;installEvent=null;await e.prompt();let r=await e.userChoice;toast(r.outcome==='accepted'?'설치를 요청했습니다.':'설치를 취소했습니다.');return}go('info');$('installStatus').textContent='Chrome/삼성 인터넷 메뉴(⋮) → 앱 설치 또는 홈 화면에 추가. iPhone/iPad Safari 공유 → 홈 화면에 추가. 로컬 파일이 아니라 Render HTTPS 사이트에서 실행하세요. 브라우저에 따라 메뉴가 다릅니다.';window.scrollTo(0,0);toast('브라우저 메뉴에서 설치 / 홈 화면 추가를 선택하세요.')}
$('installTop').onclick=xinstall;
$('main').addEventListener('input',e=>{let k=e.target.dataset.xfield;if(k){studioDraft[k]=e.target.value;if(k==='json'){studioPreview=null;if($('xpreview'))$('xpreview').innerHTML=''}}});$('main').addEventListener('change',async e=>{let k=e.target.dataset.xfield;if(k)studioDraft[k]=e.target.value;if(e.target.id==='xfiles'){try{for(let f of e.target.files){if(f.size>160*1024*1024){xmessage('160MB 초과 파일은 제외합니다.');continue}if(/\.json$/i.test(f.name)){let data=JSON.parse(await f.text());if(Array.isArray(data)){need(data.length===1,'전체 백업은 개별 팩 JSON으로 나누어 등록하세요.');data=data[0]}setJSON(JSON.stringify(data,null,2))}else if(/\.(txt|md)$/i.test(f.name)){studioDraft.scope=[studioDraft.scope,await f.text()].filter(Boolean).join('\n\n').slice(0,120000)}else if(!studioFiles.some(x=>x.name===f.name&&x.size===f.size))studioFiles.push(f)}render()}catch(err){xmessage(err.message)}}});
$('main').addEventListener('click',async e=>{let b=e.target.closest('[data-xact]');if(!b||b.disabled)return;let v=b.dataset.xv,a=b.dataset.xact;try{switch(a){case 'studio':studioOpen=true;go('info');document.getElementById('studio')?.scrollIntoView({block:'start'});break;case 'toggleStudio':studioOpen=!studioOpen;render();break;case 'install':await xinstall();break;case 'removeFile':studioFiles.splice(+v,1);render();break;case 'pdfText':await pdfText();break;case 'ai':await aiDraft();break;case 'template':if(!studioDraft.json||confirm('현재 JSON을 예시 양식으로 바꿀까요?'))setJSON(JSON.stringify(xtemplate(),null,2));break;case 'prompt':{let t=promptText();try{await navigator.clipboard.writeText(t);toast('출제 요청문을 복사했습니다.')}catch{download('출제_요청문.txt',t);xmessage('자동 복사가 제한되어 요청문 텍스트 파일을 저장했습니다.')}break}case 'scopeOnly':xlocal(false);break;case 'localGenerate':xlocal(true);break;case 'validate':studioPreview=null;$('xpreview').innerHTML='';studioPreview=xvalidate(JSON.parse(studioDraft.json.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'')));$('xpreview').innerHTML=previewHTML();xmessage('형식 검증 완료. 내용은 직접 확인하세요.');break;case 'saveDraft':download('korean_learning_draft.json',J(xvalidate(JSON.parse(studioDraft.json))),'application/json');break;case 'approve':need(studioPreview&&$('xReviewed')?.checked,'검토 확인란을 체크하세요.');if(addPack(studioPreview)){if(!savePacks())toast('저장 공간 부족: JSON을 내보내세요.');studioPreview=null;studioDraft.json='';studioMessage='학습팩 등록 완료. 기존 공식 랭킹은 변경하지 않았습니다.';render()}else xmessage('이미 동일한 학습팩이 등록되어 있습니다.');break;case 'openPack':topic=v;unit='all';go('analysisText');break;case 'exportPack':download('korean_learning_pack.json',JSON.stringify(packs.find(x=>x.key===v).data,null,2),'application/json');break;case 'exportAll':download('korean_learning_packs.json',JSON.stringify(packs.map(x=>x.data),null,2),'application/json');break;case 'publish':await xpublish();break;case 'examStart':xstartExam(v);break;case 'extraWrong':{let last=new Map;for(let r of extraRecords())last.set(r.qid,r);reviewIds([...last.values()].filter(r=>!r.ok||r.unsure).map(r=>r.qid));break}}}catch(err){xmessage(err.message||String(err));toast(err.message||String(err))}});

// restore session and allow group invites from a public static URL
render();(async()=>{await handleRedirect();if(signed()&&isConfigured())await initOnline();let invite=new URLSearchParams(location.search).get('group');if(invite){go('info');if($('joinCode'))$('joinCode').value=invite;else toast('로그인 후 그룹 코드 '+invite+'로 가입할 수 있습니다.')}})();
