93","text":"공감이 유도한 행동은 단기적으로 도움이 되더라도 장기적으로 도덕적 문제를 낳을 수 있다.","why":"필자의 결론은 가능성에 관한 주장이지 공감의 전면 부정이 아니다."},{"k":"뱃슨의 가설","p":"90","text":"공감이 타인을 돕도록 이끌 수 있지만 그 이타적 행동의 도덕성은 별개이다.","why":"뱃슨은 도움 행동을 인정하되 도덕적 평가와 구별한다."},{"k":"실험 조건","p":"90~91","text":"한 집단에는 객관적 태도를, 다른 집단에는 셰리의 감정을 상상하도록 요구했다.","why":"공감 억제와 유도 조건을 비교하는 실험이다."},{"k":"실험 결과","p":"91","text":"공감 유도 집단의 4분의 3과 억제 집단의 3분의 1이 치료 순서 변경을 원했다.","why":"유도 집단에서 셰리 우선 치료를 희망한 비율이 더 높다."},{"k":"순서 변경의 영향","p":"91","text":"셰리의 순서가 앞당겨지면 앞에 있던 다른 환자들은 더 오래 기다리게 된다.","why":"도움의 대상 외에 불이익이 생길 수 있다는 조건을 명확히 알렸다."},{"k":"스포트라이트의 장점","p":"91","text":"특정 대상의 고통을 눈에 띄게 하여 도움을 촉진한다.","why":"공감의 긍정적 측면도 비유를 통해 설명한다."},{"k":"스포트라이트의 약점","p":"91~92","text":"좁은 초점 때문에 관심 대상 외의 사람들은 외면될 수 있다.","why":"선택적 관심과 편견의 영향을 드러낸다."},{"k":"해비탯 실험","p":"92","text":"가족을 이미 선정했다고 들은 집단에서 더 많은 기부가 이루어졌다.","why":"구체적 대상과 추상적 대상의 차이를 보여 준다."},{"k":"약 개발 실험","p":"92","text":"추상적으로 제시된 한 명과 여덟 명에 대한 기부액은 비슷했다.","why":"대상의 수가 감정적 반응에 비례하지 않았다."},{"k":"사진과 이름","p":"92","text":"아이의 이름과 사진을 제시하자 기부액이 크게 증가했다.","why":"대상의 구체성이 기부 반응에 영향을 미쳤다."},{"k":"인식 가능한 희생자 효과","p":"92~93","text":"구체적으로 인식되는 희생자에게 더 큰 도움 반응을 보이는 편향을 뜻한다.","why":"대상의 구체성과 수의 차이를 분리해 이해한다."},{"k":"셸링의 의견","p":"92","text":"특정 소녀의 수술비를 호소하는 경우 병원 시설 악화라는 추상적 호소보다 기부를 이끌기 쉽다.","why":"인식 가능한 희생자 효과를 뒷받침하는 사례이다."},{"k":"이성의 역할","p":"93","text":"도덕적 결정에서 숫자의 중요성을 인식하는 데 이성이 필요하다.","why":"감정의 근시안적 한계와 이성의 역할을 대비한다."}]},"base":{"theme":"긴장되는 순간 자기 능력과 동료를 신뢰하고 실패를 절대화하지 않으며 일상을 떠올리는 태도.","structure":[["처음 · 102쪽","야구 팬 경험에서 흔들리는 투수의 고독과 짤막한 위로의 효과에 주목한다."],["중간 · 103~104쪽","네 가지 위로의 의미를 차례로 풀어낸다."],["끝 · 104쪽","필자가 자신의 삶에 위로를 적용하고 질문으로 독자의 성찰을 이끈다."]],"table":[["위로의 말","함축"],["네 공을 누가 쳐?","자신의 실력 신뢰"],["야수들 뒀다 뭐 해?","동료의 도움 신뢰"],["괜찮아. 내일 이기면 돼.","실패·비난의 부담 완화"],["어제저녁 뭐 먹었어?","현재를 일상의 일부로 받아들임"]],"traps":["외딴섬 비유는 물리적 위치가 아닌 심리적 고립감이다.","유사한 문장 반복은 리듬과 긴장감을 높인다.","동료 신뢰는 책임을 전가하라는 뜻이 아니다."],"unit":3,"name":"어제저녁 뭐 먹었어?","p":"102~104","genre":"수필 · 홍인혜","concepts":[{"k":"야구 팬의 경험","p":"102","text":"경기 승패에 따라 필자의 기분이 크게 달라지는 경험으로 글을 시작한다.","why":"필자는 프로 야구를 즐겨 보는 관찰자이다."},{"k":"투수의 부담","p":"102","text":"동료와 코치, 팬의 기대를 혼자 짊어진 듯한 투수의 불안과 고독이 드러난다.","why":"마운드에 선 투수의 부담을 공감적으로 묘사한다."},{"k":"외딴섬 비유","p":"102","text":"마운드를 외딴섬에 비유해 위기에 처한 투수의 고립감을 강조한다.","why":"공간 비유는 심리 상태를 드러낸다."},{"k":"유사한 문장 구조","p":"102","text":"잿빛과 잿더미, 주자와 시름의 대응을 통해 긴장된 분위기를 강조한다.","why":"반복은 리듬감과 심리적 긴장감을 높인다."},{"k":"짤막한 대화","p":"102","text":"코치나 포수와 몇 마디를 나눈 뒤 투수가 안정을 되찾는 현상에 주목한다.","why":"말의 심리적 효과가 이후 글의 중심 소재가 된다."},{"k":"네 공을 누가 쳐?","p":"103","text":"자신의 재능과 실력을 신뢰하도록 돕는 말이다.","why":"투수에게 능력에 대한 확신을 준다."},{"k":"야수들 뒀다 뭐 해?","p":"103","text":"동료의 도움을 믿고 모든 부담을 혼자 지지 않도록 한다.","why":"의지할 동료가 있다는 점이 핵심이다."},{"k":"괜찮아. 내일 이기면 돼.","p":"103","text":"한 번의 실패가 모든 것을 결정하지 않으며 투수를 탓하지 않겠다는 위로이다.","why":"실패에 대한 부담과 비난의 두려움을 줄인다."},{"k":"어제저녁 뭐 먹었어?","p":"104","text":"평범한 일상을 떠올리게 하여 긴장된 상황을 일상의 한 순간으로 받아들이게 한다.","why":"질문은 부정적 미래 상상에서 일상으로 주의를 돌린다."},{"k":"필자의 성찰","p":"104","text":"투수에게 건넨 위로를 자신의 긴장되는 순간에도 적용한다.","why":"경기 관찰에서 보편적 삶의 성찰로 확장한다."},{"k":"마지막 의문문","p":"104","text":"독자가 질문에 스스로 답하며 글의 깨달음을 자신의 삶과 연결하게 한다.","why":"열린 질문은 독자의 성찰을 유도한다."},{"k":"글의 갈래","p":"102~104","text":"구체적인 경험에서 깨달음을 이끌어 내는 정서 표현과 자기 성찰의 수필이다.","why":"일상 경험과 필자의 생각이 중심이다."}]},"soc":{"theme":"쟁점, 배경, 인과 관계 및 필자의 관점을 파악하고 근거와 대안의 타당성을 비판적으로 평가한다.","structure":[["읽기 · 138쪽","쟁점과 배경을 이해하고 원인·영향을 파악한다. 여러 관점을 비교하고 설명·평가의 논리성을 검토한다."],["쓰기 · 138쪽","입체적 이해를 바탕으로 사실·통계·전문가 의견을 논거로 사용하며 구체적 해결 방법과 실행 효과를 제시한다."]],"table":[["읽기","쓰기"],["쟁점과 사회·문화적 배경","현상 자체에 대한 입체적 이해"],["인과 관계와 관점 평가","객관적 논거 및 실행 가능한 대안"]],"traps":["필자의 관점을 무비판적으로 수용하지 않는다.","한 가지 사례만으로 복합적인 사회 현상을 단정하지 않는다."],"unit":4,"name":"사회·문화 분야의 글","p":"138","genre":"핵심 이론","concepts":[{"k":"쟁점과 배경","p":"138","text":"사회적 현상이나 쟁점과 그 배경을 먼저 파악해야 한다.","why":"맥락은 현상의 의미를 이해하는 출발점이다."},{"k":"인과 관계","p":"138","text":"현상의 원인과 영향을 다룬 내용 사이의 인과 관계를 파악해야 한다.","why":"사회 현상은 원인과 결과의 관련성을 파악해야 한다."},{"k":"관점 평가","p":"138","text":"필자의 설명과 해석, 평가가 논리적이고 타당한지 따져야 한다.","why":"필자의 관점에 따라 문제 인식이나 대책이 달라질 수 있다."},{"k":"다른 관점","p":"138","text":"동일한 화제를 다룬 다른 관점의 글을 함께 읽으면 입체적 이해에 도움이 된다.","why":"관점 비교를 통해 현상을 심층적으로 이해한다."},{"k":"객관적 논거","p":"138","text":"자신의 의견을 제시할 때 명확한 사실, 통계, 전문가 의견을 논거로 활용한다.","why":"객관적인 근거가 주장의 타당성을 높인다."},{"k":"해결 방안","p":"138","text":"실현 가능한 구체적 대안과 실행 효과를 함께 제시하면 설득력이 높아진다.","why":"실현 가능성과 효과의 제시가 중요하다."},{"k":"입체적 이해","p":"138","text":"자신이 보는 단면만 강조하면 다른 이해관계의 독자에게 외면받을 수 있다.","why":"다양한 관련 요인과 관점을 고려해야 한다."}]},"lag":{"theme":"라그랑주점의 위치별 특성, 활용 가능성과 우주 개발의 한계를 설명한다.","structure":[["156쪽","우주 물체가 중력의 영향을 받으며 ISS의 궤도 조정이 필요하다는 설명."],["157~158쪽","라그랑주점의 개념, L1의 태양 관측과 L2의 먼 우주 관측 활용."],["159쪽","L3의 접근성 한계, L1~L3의 미세 조정, L4·L5의 안정성과 미래 활용."]],"table":[["지점","위치","활용·특징"],["L1","지구에서 태양 방향 약 150만 km","태양·태양풍 관측 (SOHO, ACE)"],["L2","지구에서 태양 반대 방향 약 150만 km","먼 우주 관측 (WMAP, JWST 사례)"],["L3","태양 기준 지구 반대편","태양 뒤편 관측 가능, 접근 어려움"],["L4·L5","지구 궤도 앞뒤 60도","상대적 안정성, 넓은 시설 배치 범위"]],"traps":["접근성이 좋다고 위치 유지가 더 안정적인 것은 아니다.","L1~L3는 미세 조정이 필요하다.","교과서의 설명을 시험 기준으로 사용한다. 실제로 라그랑주점은 회전계의 유효 힘이 평형을 이루는 곳이며, 무중력 지점은 아니다."],"unit":4,"name":"우주 휴게소 ‘라그랑주점’","p":"156~159","genre":"과학·기술 설명문","concepts":[{"k":"우주 공간","p":"156","text":"우주의 물체는 여러 천체의 중력을 받으므로 우주라고 해서 정지해 있지 않다.","why":"글은 우주가 무중력이라는 통념에 문제를 제기한다."},{"k":"ISS","p":"156","text":"국제 우주 정거장은 약 400km 높이에 있으며 궤도 유지를 위해 추진 장치를 사용한다고 설명한다.","why":"본문의 설명을 기준으로 한다. 실제 궤도 저하는 주로 대기 저항과 관련된다."},{"k":"라그랑주점의 취지","p":"157","text":"라그랑주점은 우주 시설물의 위치 유지 부담을 줄이는 데 유리한 지점으로 소개된다.","why":"두 천체가 이루는 회전계의 평형과 효율적 운용이 핵심이다."},{"k":"개수와 명명","p":"157","text":"태양-지구 회전계의 라그랑주점은 L1부터 L5까지 다섯 곳이다.","why":"라그랑주의 이름에서 L을 가져왔다."},{"k":"L1 위치","p":"157","text":"L1은 지구에서 태양 방향으로 약 150만 km 떨어져 있다.","why":"태양과 지구 사이의 위치이다."},{"k":"L1 활용","p":"157","text":"SOHO와 에이스 위성은 L1 부근에서 태양과 태양풍을 관측하는 예이다.","why":"L1은 지구와 같은 방향에서 태양을 바라보기에 좋다."},{"k":"L2 위치와 활용","p":"158","text":"L2는 지구에서 태양 반대 방향에 있어 먼 우주 관측에 유리하다.","why":"태양 빛의 방해를 줄이는 활용과 연결된다."},{"k":"L2 관측 장비","p":"158","text":"교과서는 WMAP과 제임스 웨브 우주 망원경을 L2 활용 사례로 소개한다.","why":"실제 현재 위치가 아닌 교과서에 소개된 활용 사례를 구별한다."},{"k":"L3 위치","p":"159","text":"L3는 태양을 중심으로 지구와 반대편에 위치한다.","why":"지구에서 접근하기 어려운 이유와 연결된다."},{"k":"L3 활용","p":"159","text":"L3에 관측 위성을 두면 태양 뒤편을 관찰하는 데 도움이 될 수 있다.","why":"글은 미래 활용 가능성을 설명한다."},{"k":"L1~L3 안정성","p":"159","text":"L1~L3는 직선상에 있고 궤도 유지를 위한 미세 조정이 필요하다.","why":"평형과 안정성을 혼동하지 않는다."},{"k":"L4·L5 위치","p":"159","text":"지구 궤도 앞뒤 60도 지점이며 태양까지의 거리는 지구와 같다.","why":"삼각형 배치와 상대적 안정성이 핵심이다."},{"k":"L4·L5 안정성","p":"159","text":"L4·L5는 상대적으로 안정적이고 안정된 범위가 넓어 많은 시설물 배치에 유리하다.","why":"접근성과 안정성은 다른 기준이다."},{"k":"우주 개발 전망","p":"159","text":"라그랑주점을 활용한 우주 기지는 미래 가능성이지만 건설 비용 등 난제도 있다.","why":"가능성과 현실적 한계를 함께 제시한다."}]},"auto":{"theme":"인지·판단·제어의 작동 원리와 자율 주행의 기술적·사회적 문제.","structure":[["164쪽","인지 단계와 레이더·라이다의 원리."],["165~166쪽","카메라, 영상 분류, GPS와 SLAM, 판단 결과의 실행과 제어의 중요성."],["167쪽","트롤리 딜레마와 책임 주체, 기술적·사회적 문제의 해결 필요성."]],"table":[["기술","핵심 역할","단계"],["레이더","전파 왕복 시간 → 거리=속도×시간÷2","인지"],["라이다","레이저 → 정밀 삼차원 지도; 가격·전력·발열 한계","인지"],["카메라","영상 정보 수집","인지"],["컨볼루션 레이어","영상 속 물체 분류","판단"],["GPS·SLAM","대략적 좌표 → 지도 비교를 통한 정밀 위치","판단"],["제어","결정된 행동의 적절한 크기와 타이밍으로 조작","제어"]],"traps":["왕복 시간과 편도 거리 구분.","센서 정보 수집과 컴퓨터 분석 구분.","판단이 옳아도 제어가 틀리면 안전이 보장되지 않는다."],"unit":4,"name":"미래 자동차는 자율 주행으로 간다","p":"164~167","genre":"과학·기술 설명문","concepts":[{"k":"작동 단계","p":"164","text":"자율 주행의 작동은 인지, 판단, 제어 순서로 설명된다.","why":"정보 수집, 결정, 실행의 관계를 파악한다."},{"k":"인지","p":"164","text":"센서가 차량 주변 정보를 모아 컴퓨터에 전달하는 과정이다.","why":"인지와 제어를 구별한다."},{"k":"판단","p":"164","text":"컴퓨터가 센서 정보를 분석해 어떤 행동을 할지 결정한다.","why":"정보 분석과 행동 결정이 핵심이다."},{"k":"제어","p":"164, 166","text":"결정된 행동에 따라 자동차를 실제로 움직이는 과정이다.","why":"판단과 실행은 서로 다르다."},{"k":"레이더","p":"164","text":"전파가 되돌아오는 시간으로 전방 차량까지의 거리를 계산한다.","why":"레이더와 라이다의 수단과 역할을 구별한다."},{"k":"거리 공식","p":"164","text":"왕복 시간에 빛의 속도를 곱하고 2로 나누어 거리를 구한다.","why":"신호는 목표물까지 갔다가 돌아온다."},{"k":"라이다","p":"164~165","text":"레이저 반사 정보를 활용해 실시간 정밀 삼차원 지도를 만든다.","why":"라이다의 수단은 레이저이며 넓은 범위를 탐지한다."},{"k":"라이다의 장단점","p":"164~165","text":"정확한 환경 파악에 유리하지만 가격, 전력 소모, 발열 문제 등이 있다.","why":"장점과 한계를 함께 파악한다."},{"k":"카메라","p":"165","text":"인공 지능 기술의 도입으로 카메라 영상에서 얻을 수 있는 정보가 늘었다.","why":"영상 분석 기술이 인지 정보를 활용하는 데 기여한다."},{"k":"초기 판단 프로그램","p":"165","text":"도로 상황의 변수가 너무 다양해 모든 상황을 사람이 직접 규칙으로 작성하기 어렵다.","why":"안전과 연결되는 예외 상황이 많다."},{"k":"컨볼루션 레이어","p":"165","text":"이미지를 여러 층의 맵으로 변환하여 영상 내 물체의 종류를 분류한다.","why":"영상 분류의 인공 지능 기술이다."},{"k":"GPS와 SLAM","p":"165~166","text":"GPS로 대략적 위치를 파악하고 기존 지도와 현재 지도를 비교해 더 정밀한 위치를 파악한다.","why":"대략적 위치와 정밀화의 역할을 구별한다."},{"k":"제어의 어려움","p":"166","text":"제어에서는 조작의 크기뿐 아니라 적절한 타이밍도 중요하다.","why":"판단을 실제 움직임으로 적절하게 구현해야 한다."},{"k":"윤리 문제","p":"167","text":"트롤리 딜레마는 위급 상황의 선택과 그 선택을 사전 설계하는 문제를 제기한다.","why":"기술적 문제가 아니라 윤리적 선택과 책임이 핵심이다."},{"k":"책임과 전망","p":"167","text":"필자는 자율 주행이 유익하지만 기술적·사회적 문제도 해결하며 발전해야 한다고 본다.","why":"효용을 인정하면서 해결할 문제를 제기한다."}]},"clim":{"theme":"기후 변화의 위험성과 기술·정책적 대응, 매체 자료의 비판적 수용.","structure":[["180~181쪽","계절 변화·해수면 상승과 온도 상승별 피해를 카드 뉴스로 소개."],["182쪽","화석 연료 발전 비중, 태양광·풍력의 장단점, ESS 개발."],["183~184쪽","수소 생산 조절 및 액화 수소, 배출권 거래제의 운영과 한계, 댓글을 통한 비판과 보완."]],"table":[["대응","장점","한계·보완"],["태양광·풍력","발전 과정 공해 없음; 설비 규모 장점","계절적 편차 → ESS"],["액화 수소","약 1/800 부피, 저장·운송 유리","높은 액화 비용"],["배출권 거래","여유·부족분 거래","구매가 저렴하면 감축 동기 저하 → 점검·조정"]],"traps":["ESS는 발전량 자체를 늘리는 기술이 아니다.","액화 수소의 장점은 총비용이 반드시 저렴함을 뜻하지 않는다.","배출권 구매 비용을 투자 비용보다 낮게 하는 정책이 문제이다.","그래프 비중과 절대 발전량을 구별한다."],"unit":5,"name":"(가) 기후 변화의 위험성과 대안","p":"180~184","genre":"디지털 매체 · 블로그","concepts":[{"k":"기후 변화의 사례","p":"180","text":"교과서는 2020년 기준 가장 긴 계절이 여름으로 바뀌고 지난 30여 년간 연안 해수면이 8cm 넘게 상승했다고 소개한다.","why":"시점과 비교 방향을 지문 기준으로 판단한다."},{"k":"온도 상승 카드 뉴스","p":"181","text":"카드 뉴스는 온도 상승 폭별로 예상되는 기후 변화의 피해를 비교하여 위험성을 전달한다.","why":"여러 상승 단계의 피해를 시각적으로 제시한다."},{"k":"COP27 전망","p":"182","text":"글은 2022년 COP27의 2100년까지 평균 온도 최소 2.4도 이상 상승 전망을 소개한다.","why":"과거 자료의 전망을 현재 확정 사실과 구분한다."},{"k":"습지 전망","p":"182","text":"현재와 같은 양의 이산화 탄소를 계속 배출할 경우 21세기 말 내륙 습지의 26%가 소멸 위기에 놓일 수 있다고 제시한다.","why":"조건과 가능성 표현을 확인한다."},{"k":"화석 연료 발전","p":"182","text":"2021년 교과서 그래프에서 석탄 34.3%, LPG 29.2%로 합계 63.5%이다.","why":"34.3+29.2=63.5이며 그래프는 발전량이 아닌 비중이다."},{"k":"신재생 비중","p":"182","text":"그래프에서 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 높아졌다.","why":"비중은 3.8%p 증가했다."},{"k":"태양광·풍력 공통점","p":"182","text":"발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 관여하지 않아도 발전할 수 있다고 설명한다.","why":"발전 과정의 공통 장점이다."},{"k":"태양광과 풍력 차이","p":"182","text":"태양광은 가정의 소형 설치가 가능하고 풍력은 대형화로 발전기 하나에서 많은 전력을 생산할 수 있다.","why":"각각의 장점을 뒤바꾸지 않는다."},{"k":"계절적 편차","p":"182","text":"교과서는 두 발전 방식 모두 전력 수요가 큰 여름철의 발전량이 연평균에 못 미친다고 설명한다.","why":"발전량과 수요의 불균형이 핵심이다."},{"k":"ESS","p":"182","text":"에너지 저장 시스템을 개발하여 계절적 발전 편차에 따른 공급 문제를 보완하려 한다.","why":"저장은 공급 안정성 보완이지 발전량 자체 증가와 동일하지 않다."},{"k":"수소 생산 조절","p":"183","text":"수소는 화학 공정이나 수전해로 만들어져 생산량을 조절하는 방식으로 간헐성을 보완할 수 있다.","why":"생산 조절의 가능성을 재생 에너지와 대비한다."},{"k":"액화 조건","p":"183","text":"수소는 영하 253도 이하에서 액화되고 부피가 기체의 약 800분의 1까지 줄어든다.","why":"온도와 부피 변화 방향에 유의한다."},{"k":"액화 장단점","p":"183","text":"액화 수소는 저장·운송에 유리하나 액화 비용이 높다.","why":"물류상의 이점과 비용 한계를 구별한다."},{"k":"배출권 거래","p":"183~184","text":"정부가 배출 허용량을 할당하고 기업은 여분이나 부족분의 배출권을 거래할 수 있다.","why":"할당량 준수와 기업 간 거래가 제도의 특징이다."},{"k":"감축 동기","p":"184","text":"배출권 구매가 설비 투자보다 저렴하면 실질적 감축 노력을 이끌기 어려울 수 있다.","why":"정부 기관의 점검과 조정이 필요한 이유이다."},{"k":"댓글의 역할","p":"184","text":"출처 문의, 추가 자료 제안, 원인 설명의 불균형 지적이 글의 보완을 촉진한다.","why":"디지털 매체의 상호 작용과 비판적 수용이 드러난다."}]},"mud":{"theme":"갯벌의 규조류 광합성과 탄소 저장 기능, 시청각 자료로 전달하는 과학적 정보.","structure":[["185쪽 실험","건강한 펄에 빛을 쬐어 산소 기포를 관찰한다."],["185쪽 설명","규조류가 이산화 탄소를 흡수하고 산소를 배출하며 탄소를 저장한다."],["185쪽 확장","먹이 관계를 통해 탄소가 다른 생물의 몸이나 갯벌에 저장된다. 블루 카본을 통한 감축에 기여한다."]],"table":[["과정","설명"],["광합성","CO₂ 흡수·산소 배출"],["탄소의 이동","규조류 → 다른 생물의 몸 또는 갯벌"],["블루 카본","연안 생태계가 격리·저장한 탄소"]],"traps":["블루 카본은 산소가 아니라 저장된 탄소이다.","한 관찰 결과를 전국 갯벌의 정확한 저장량으로 일반화하지 않는다."],"unit":5,"name":"(나) 지구를 위한 보물, 순천만 갯벌","p":"185","genre":"방송 매체 · 다큐멘터리","concepts":[{"k":"실험 과정","p":"185","text":"습지의 건강한 펄에 빛을 쬐어 광합성을 유도하자 기체 방울이 발생했다.","why":"교과서에 제시된 관찰 조건이다."},{"k":"산소 생성","p":"185","text":"규조류의 광합성으로 산소가 생성되며 건강한 갯벌일수록 규조류가 많고 산소량도 많다고 설명한다.","why":"지문의 규조류와 산소량의 관계에 근거한다."},{"k":"블루 카본","p":"185","text":"연안 생태계의 식물과 퇴적물 등이 격리하거나 저장하는 탄소를 뜻한다.","why":"탄소 저장과 산소 배출을 구별한다."},{"k":"탄소 이동","p":"185","text":"규조류에 저장된 탄소는 먹이 관계를 통해 다른 생물의 몸에 들어가거나 갯벌에 갇힌다.","why":"탄소의 이동과 저장 경로를 설명한다."},{"k":"복원 의미","p":"185","text":"건강한 갯벌을 보전하는 정책은 해양 생태계의 탄소 저장 기능을 유지하는 데 기여할 수 있다.","why":"지문에 근거한 정책 적용이다."},{"k":"방송 매체","p":"185","text":"실험 장면과 해설, 연구원 인터뷰가 결합되어 원리와 관찰 결과의 이해를 돕는다.","why":"방송 자료의 표현 특성에 주목한다."}]},"hyd":{"theme":"수소의 생산 방식과 배출 특성에 따른 두 분류 기준, 그린 수소 전환의 경제성.","structure":[["186쪽 상단","부생·추출·수전해의 생산 원리와 장단점을 비교."],["186쪽 하단","그레이·블루·그린 수소의 탄소 배출 특성, 블루 수소의 중간 단계 역할."]],"table":[["생산 방식","원리","장단점"],["부생","정유·석유 화학 공정 부산물","저비용, 공급 제한·CO₂"],["추출","화석 연료+수증기, 고온·고압","대량 생산, CO₂"],["수전해","물 전기 분해","전력 출처 고려, 고비용"],["배출 기준","그레이 / 블루 / 그린","대기 배출 / 포집·처리 / 신재생 전기 수전해"]],"traps":["생산 방법과 탄소 배출 기준을 일대일로 연결하지 않는다.","수전해는 전력 출처를 고려해야 한다.","그린 수소 전환의 중간 단계로 블루 수소를 활용한다."],"unit":5,"name":"(다) 수소의 종류와 특징","p":"186","genre":"인쇄 매체 · 설명문","concepts":[{"k":"부생 수소","p":"186","text":"정유·석유 화학 공정에서 부산물로 얻으며 비용이 저렴하다.","why":"생산 목적과 부산물 여부를 구분한다."},{"k":"부생 수소 한계","p":"186","text":"공장 내 다른 공정에서 대부분 사용되어 외부 공급량이 제한되고 생산 중 이산화 탄소가 나온다.","why":"저비용이 무제한 공급이나 친환경성을 의미하지 않는다."},{"k":"추출 수소","p":"186","text":"화석 연료를 고온·고압에서 수증기와 반응시켜 수소 생산을 목적으로 얻는다.","why":"추출과 수전해의 생산 원리를 구분한다."},{"k":"추출 수소 특징","p":"186","text":"부생 수소 다음으로 경제적이고 대량 생산이 가능하지만 이산화 탄소가 발생한다.","why":"비용 순서와 생산량의 장단점을 파악한다."},{"k":"수전해 원리","p":"186","text":"물을 전기 분해하여 수소를 생산한다.","why":"전기 분해 방식이다."},{"k":"전기의 생산 방식","p":"186","text":"화석 연료로 생산한 전기를 이용한 수전해는 완전한 친환경 방식이라고 보기 어렵다.","why":"공정 자체와 전력 생산 과정의 탄소 배출을 구별한다."},{"k":"수전해 경제성","p":"186","text":"신재생 에너지 전기로 수전해하면 온실가스 배출을 줄일 수 있지만 높은 생산 비용이 문제이다.","why":"친환경성과 경제성은 별개의 평가 기준이다."},{"k":"그레이 수소","p":"186","text":"화석 연료로 생산하면서 발생한 이산화 탄소를 대기 중에 배출하는 수소이다.","why":"생산과 탄소 처리 방식에 따른 분류이다."},{"k":"블루 수소","p":"186","text":"화석 연료에서 추출하면서 발생하는 이산화 탄소를 포집하여 처리하는 수소이다.","why":"그레이 수소와 다른 점은 탄소 포집·처리이다."},{"k":"그린 수소","p":"186","text":"신재생 에너지 전기로 물을 전기 분해하여 친환경적으로 생산한 수소이다.","why":"전력의 출처가 분류 조건에 포함된다."},{"k":"전환의 중간 단계","p":"186","text":"그린 수소의 경제성이 충분해지기 전 블루 수소로 수요를 충당하는 방안이 시도된다.","why":"블루 수소는 그린 수소로 가는 중간 역할이다."},{"k":"두 분류 기준","p":"186","text":"부생·추출·수전해는 생산 방식, 그레이·블루·그린은 배출 특성에 따른 구분이다.","why":"두 분류 기준을 혼동하지 않는다."}]},"media":{"theme":"매체의 유형과 특성에 맞추어 신뢰성과 공정성을 판단하며 목적·수용자·파급 효과를 고려한다.","structure":[["178쪽 · 논술 연계 이론","인쇄·방송·디지털 매체의 전달 방식과 한계를 비교한다."],["180~186쪽","블로그, 방송 다큐멘터리, 인쇄 자료를 비교하며 매체 특성과 자료의 신뢰성을 분석한다."]],"table":[["매체","양식","소통"],["인쇄","문자·사진·도표","간접적, 실시간 제한"],["방송","영상·음성","대량 실시간 전달, 수용자 수동적"],["디지털","복합양식·하이퍼텍스트","실시간·쌍방향, 신뢰성 문제 가능"]],"traps":["출처 누락은 신뢰성, 원인 편중은 공정성에 연결한다.","복합양식성과 하이퍼텍스트는 서로 다른 개념이다.","조회 수나 댓글 수만으로 정확성이 보장되지 않는다."],"unit":5,"name":"매체의 특성과 통합 독해","p":"178, 180~186","genre":"논술 연계 이론","concepts":[{"k":"인쇄 매체","p":"178","text":"문자, 사진, 도표 등을 통한 간접적 소통이 가능하나 실시간 상호 작용은 제한된다.","why":"매체 유형별 전달 방식을 구분한다."},{"k":"방송 매체","p":"178","text":"대량의 정보를 실시간 전달할 수 있으나 수용자는 일반적으로 수동적 위치에 있다.","why":"디지털 기능과 기존 방송 매체의 기본 특성을 구분한다."},{"k":"디지털 매체","p":"178","text":"실시간 전달과 쌍방향 상호 작용이 가능하나 신뢰성 및 개인정보 문제도 발생할 수 있다.","why":"장점과 문제점을 함께 이해한다."},{"k":"복합양식성","p":"178","text":"문자, 영상, 소리, 이미지 등 여러 양식을 결합하여 의미를 구성하는 특성이다.","why":"표현 양식 결합과 텍스트 연결을 구별한다."},{"k":"하이퍼텍스트","p":"178","text":"텍스트들이 자유롭게 연결되어 관련 자료로 이동할 수 있는 구조이다.","why":"링크 등 텍스트 연결이 중심이다."},{"k":"신뢰성","p":"178, 184","text":"자료의 출처를 확인하고 정확한 정보인지 검토하여 판단한다.","why":"출처와 내용의 정확성을 평가해야 한다."},{"k":"공정성","p":"178, 184","text":"관련된 관점과 요인을 균형 있게 제시했는지 확인한다.","why":"기후 변화 원인에 대한 댓글과 연결한다."},{"k":"생산 목적과 수용자","p":"178","text":"매체를 선택할 때 쓰기 목적과 예상 수용자의 관심, 배경지식 등을 고려한다.","why":"목적과 수용자에 맞는 양식 선택이 필요하다."},{"k":"파급 효과","p":"178","text":"생산한 정보가 수용자와 사회에 미칠 영향을 고려해야 한다.","why":"디지털 정보의 확산과 책임을 연결한다."}]},"mix":{"theme":"기후 대응·갯벌·수소를 통합 비교하고 정책의 타당성과 매체 자료를 비판적으로 판단한다.","structure":[["가 · 180~184쪽","배출 감축과 에너지 공급 안정성."],["나 · 185쪽","갯벌의 탄소 저장 기능."],["다 · 186쪽","수소 생산 방식과 탄소 처리, 비용의 관계."]],"table":[["대상","보완·활용"],["에너지 공급","ESS"],["생태계","규조류·블루 카본"],["수소 생산","블루 수소 중간 단계·그린 수소"],["제도","배출권 거래제 점검·조정"]],"traps":["여러 정책의 목적은 연결할 수 있어도 작동 원리가 동일한 것은 아니다.","정책의 타당성 평가에서 근거와 한계, 개선 방안을 모두 제시한다."],"unit":5,"name":"(가)·(나)·(다) 통합","p":"180~186","genre":"통합 적용","concepts":[]}},"questions":[{"id":"K0001","t":"emp","unit":3,"kind":"practice","level":"기본","typ":"OX","stem":"공감의 대상에게 친절해진다는 주장은 경험과 상식, 실험 연구의 지지를 받는다.","opts":["O","X"],"a":0,"ex":"서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다.","p":"90","why":["서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다.","서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다."],"passage":"","mode":"ox"},{"id":"K0002","t":"emp","unit":3,"kind":"practice","level":"기본","typ":"논증","stem":"공감의 배신에 대한 설명 중 적절한 것은?","opts":["필자는 단순한 상황에서도 공감에 대한 지지를 전혀 인정하지 않는다.","셰리의 순서를 앞당겨도 다른 환자의 대기 시간은 변하지 않는다고 안내했다.","공감의 대상에게 친절해진다는 주장은 경험과 상식, 실험 연구의 지지를 받는다.","필자는 도덕적 결정에서 감정만으로 피해 규모를 정확히 비교할 수 있다고 보았다.","스포트라이트의 비유는 모든 대상에 균등한 관심을 쏟는 공감의 성질을 보여 준다."],"a":2,"ex":"서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다.","p":"90, 93, 91, 91~92","why":["단순한 세계라는 가정 아래 제한적으로 동의한다.","도움의 대상 외에 불이익이 생길 수 있다는 조건을 명확히 알렸다.","서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다.","감정의 근시안적 한계와 이성의 역할을 대비한다.","선택적 관심과 편견의 영향을 드러낸다."],"passage":"","mode":"choice"},{"id":"K0003","t":"emp","unit":3,"kind":"practice","level":"심화","typ":"논증","stem":"공감의 배신에 대한 설명 중 적절하지 않은 것은?","opts":["공감이 유도한 행동은 단기적으로 도움이 되더라도 장기적으로 도덕적 문제를 낳을 수 있다.","공감이 타인을 돕도록 이끌 수 있지만 그 이타적 행동의 도덕성은 별개이다.","필자는 공감이 타인을 돕게 한다는 사실 자체를 부정한다.","좁은 초점 때문에 관심 대상 외의 사람들은 외면될 수 있다.","아이의 이름과 사진을 제시하자 기부액이 크게 증가했다."],"a":2,"ex":"서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다.","p":"90, 92, 91~92, 90, 93","why":["필자의 결론은 가능성에 관한 주장이지 공감의 전면 부정이 아니다.","뱃슨은 도움 행동을 인정하되 도덕적 평가와 구별한다.","서론에서 일반적 견해를 인정한 뒤 도덕적 결과의 보장 여부에 문제를 제기한다.","선택적 관심과 편견의 영향을 드러낸다.","대상의 구체성이 기부 반응에 영향을 미쳤다."],"passage":"","mode":"choice"},{"id":"K0004","t":"emp","unit":3,"kind":"practice","level":"기본","typ":"OX","stem" 전 방식의 공통 장점과 한계를 밝히고 전력 공급을 보완할 방안을 설명할 것.","answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에 따르면 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 따라서 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.","criteria":[{"text":"발전 과정의 장점","keys":["공해","관여"]},{"text":"계절적 편차","keys":["계절적 편차","계절별"]},{"text":"여름 수요·발전량 불균형","keys":["여름","연평균"]},{"text":"ESS 활용","keys":["ESS","에너지 저장 시스템"]}],"p":"182"},{"label":"갯벌 복원","proposal":"훼손된 연안 갯벌을 복원하고 규조류가 살아갈 수 있는 건강한 생태계를 유지한다.","task":"(나)를 근거로 갯벌 복원이 타당한 이유를 광합성, 탄소 이동 경로, 블루 카본을 포함해 설명할 것.","answer":"갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 이처럼 해양 생태계가 저장하는 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.","criteria":[{"text":"규조류·광합성","keys":["규조류","광합성"]},{"text":"이산화 탄소 흡수·산소 배출","keys":["이산화 탄소","산소"]},{"text":"먹이 관계와 탄소 저장","keys":["먹","다른 생물","갯벌"]},{"text":"블루 카본 및 감축","keys":["블루 카본","감축"]}],"p":"185"},{"label":"배출권 거래","proposal":"기업의 부담을 줄이기 위해 배출권 구매 비용을 감축 설비 투자 비용보다 낮게 유지하고 이후 정부의 점검을 중단한다.","task":"(가)를 근거로 제도의 운영 원리, 해당 가격 정책의 한계 및 개선 방안을 서술할 것.","answer":"온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부 기관은 거래제의 운영을 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.","criteria":[{"text":"할당·거래","keys":["할당","거래"]},{"text":"비용 비교","keys":["구매","설비 투자"]},{"text":"감축 동기 저하","keys":["감축 동기","감축 노력"]},{"text":"지속적 점검 및 조정","keys":["점검","조정"]}],"p":"183~184"},{"label":"홍보 매체","proposal":"종이 소식지만으로 시민들의 의견을 실시간 수렴하고 정책의 미비점을 즉시 반영하려 한다.","task":"인쇄 매체의 한계와 홍보 목적을 연결하여 평가하고, 디지털 매체를 활용한 대안을 제시할 것.","answer":"인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 따라서 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다.","criteria":[{"text":"인쇄 매체","keys":["인쇄 매체","종이"]},{"text":"실시간 전달·상호 작용 한계","keys":["실시간","한계"]},{"text":"디지털 대안","keys":["디지털 매체","누리집","블로그"]},{"text":"쌍방향 의견 수렴","keys":["쌍방향","댓글","게시판"]}],"p":"178"}],"terms":["에너지 저장 시스템","ESS","계절적 편차","규조류","블루 카본","온실가스 배출권 거래제","감축 동기","인쇄 매체","쌍방향 상호 작용"],"answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에서 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 이에 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.\n\n갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 해양 생태계의 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.\n\n온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부는 거래제를 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.\n\n인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 이에 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다."},{"id":"E02","title":"청소년 환경 뉴스 기획안","intro":"환경 동아리는 기후 위기와 친환경 에너지를 청소년에게 이해하기 쉽게 전달하려 한다.","blocks":[{"label":"자료의 신뢰성과 공정성","proposal":"계절의 길이와 해수면 상승 수치의 출처를 생략하고 기후 변화는 오직 인위적 원인으로 발생한다고 설명한다.","task":"(가)의 댓글을 근거로 신뢰성과 공정성의 문제를 각각 지적하고 수정 방향을 제시할 것.","answer":"(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.","criteria":[{"text":"신뢰성·출처 누락","keys":["신뢰성","출처"]},{"text":"신뢰 가능한 자료 확인","keys":["확인","출처"]},{"text":"공정성·인위적 원인 편중","keys":["공정성","인위적"]},{"text":"자연·인위 원인 균형","keys":["자연적","균형"]}],"p":"178, 184"},{"label":"액화 수소","proposal":"액화하면 부피가 줄어들어 저장·운송에 유리하므로 모든 비용이 저렴하다고 홍보하고 곧바로 전면 보급한다.","task":"(가)를 근거로 액화 조건, 부피 변화, 활용의 장점과 비용상의 한계를 설명할 것.","answer":"(가)에 따르면 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 따라서 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.","criteria":[{"text":"영하 253도","keys":["253","영하"]},{"text":"약 1/800 부피","keys":["800","부피"]},{"text":"저장과 운송","keys":["저장","운송"]},{"text":"액화 비용 및 검토","keys":["액화 비용","비용"]}],"p":"183"},{"label":"디지털 매체 구성","proposal":"환경 지식이 부족한 청소년과 의견을 교환하려 하지만 긴 문자만 사용하고 관련 링크와 댓글을 차단한다.","task":"예상 수용자와 목적을 고려하여 복합양식성, 하이퍼텍스트, 쌍방향 상호 작용을 활용할 개선 방안을 제시할 것.","answer":"환경 지식이 부족한 청소년을 대상으로 한다면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다.","criteria":[{"text":"수용자 및 목적","keys":["청소년","이해"]},{"text":"복합양식성","keys":["복합양식성","영상"]},{"text":"하이퍼텍스트","keys":["하이퍼텍스트","링크"]},{"text":"쌍방향 상호 작용","keys":["쌍방향","댓글"]}],"p":"178, 180~184"},{"label":"영상 자료 활용","proposal":"갯벌에서 산소가 발생하는 실험 장면과 연구원 인터뷰를 홍보 자료에 추가하고, 이를 근거로 전국 갯벌의 효과를 단정하려 한다.","task":"(나)를 근거로 실험 영상과 인터뷰 활용의 타당성을 설명하고 과장 방지 및 파급 효과를 고려할 사항을 서술할 것.","answer":"(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다.","criteria":[{"text":"실험 장면","keys":["실험","기체 방울"]},{"text":"연구원 인터뷰와 이해 효과","keys":["연구원","이해"]},{"text":"자료의 범위·과장 방지","keys":["확정","과장","단정"]},{"text":"파급 효과 및 출처","keys":["파급 효과","출처"]}],"p":"178, 185"}],"terms":["신뢰성","공정성","액화 수소","복합양식성","하이퍼텍스트","쌍방향 상호 작용","파급 효과","규조류"],"answer":"(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.\n\n(가)에서 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 이에 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.\n\n청소년 대상이라면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다.\n\n(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다."},{"id":"E03","title":"푸른항만 수소 도시 전환","intro":"항만 배후 산업단지의 수소 공급과 주민 소통을 개선하려 한다.","blocks":[{"label":"수소 공급","proposal":"가격이 저렴한 부생 수소만으로 급증하는 수소 수요를 모두 충당하고 별도의 공급 방식은 검토하지 않는다.","task":"(다)를 근거로 부생 수소의 장점과 공급 한계, 추출 수소의 장단점 및 현실적 전환 방안을 설명할 것.","answer":"부생 수소는 정유·석유 화학 공정에서 부산물로 생산되어 저렴하지만, 공장 내 다른 공정에서 대부분 이용되므로 외부 공급량에 한계가 있다. 또한 화석 연료에 의존해 이산화 탄소가 발생한다. 추출 수소는 수소 생산 자체를 목적으로 하여 대량 공급에 유리하나 탄소 배출 문제가 있다. 따라서 추출 과정의 이산화 탄소를 포집·처리하는 블루 수소를 중간 단계로 활용할 수 있다.","criteria":[{"text":"부생 수소의 부산물·저비용","keys":["부산물","저렴"]},{"text":"외부 공급량 제한","keys":["외부 공급","제한","한계"]},{"text":"추출 수소 대량 생산과 CO₂","keys":["추출 수소","대량","이산화 탄소"]},{"text":"블루 수소 중간 단계","keys":["블루 수소","포집"]}],"p":"186"},{"label":"수전해 전환","proposal":"화석 연료로 생산한 전기를 사용하더라도 수전해는 완전한 친환경 방식이므로 즉시 전면 전환할 계획이다.","task":"(다)를 근거로 수전해의 원리와 친환경성 조건, 경제적 한계 및 중간 단계의 보완 방안을 설명할 것.","answer":"수전해는 물을 전기 분해하여 수소를 생산하는 방식이다. 그러나 (다)에 따르면 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전한 친환경 방식이라고 보기 어렵다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.","criteria":[{"text":"수전해 원리","keys":["전기 분해","전기분해"]},{"text":"화석 연료 전기 조건","keys":["화석 연료","전기"]},{"text":"그린 수소 비용","keys":["그린 수소","비용"]},{"text":"블루 수소·포집","keys":["블루 수소","포집"]}],"p":"186"},{"label":"갯벌 복원","proposal":"훼손된 연안 갯벌을 복원하고 규조류가 살아갈 수 있는 건강한 생태계를 유지한다.","task":"(나)를 근거로 갯벌 복원이 타당한 이유를 광합성, 탄소 이동 경로, 블루 카본을 포함해 설명할 것.","answer":"갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 이처럼 해양 생태계가 저장하는 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.","criteria":[{"text":"규조류·광합성","keys":["규조류","광합성"]},{"text":"이산화 탄소 흡수·산소 배출","keys":["이산화 탄소","산소"]},{"text":"먹이 관계와 탄소 저장","keys":["먹","다른 생물","갯벌"]},{"text":"블루 카본 및 감축","keys":["블루 카본","감축"]}],"p":"185"},{"label":"홍보 매체","proposal":"종이 소식지만으로 시민들의 의견을 실시간 수렴하고 정책의 미비점을 즉시 반영하려 한다.","task":"인쇄 매체의 한계와 홍보 목적을 연결하여 평가하고, 디지털 매체를 활용한 대안을 제시할 것.","answer":"인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 따라서 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다.","criteria":[{"text":"인쇄 매체","keys":["인쇄 매체","종이"]},{"text":"실시간 전달·상호 작용 한계","keys":["실시간","한계"]},{"text":"디지털 대안","keys":["디지털 매체","누리집","블로그"]},{"text":"쌍방향 의견 수렴","keys":["쌍방향","댓글","게시판"]}],"p":"178"}],"terms":["부생 수소","추출 수소","블루 수소","수전해","그린 수소","규조류","블루 카본","인쇄 매체","쌍방향 상호 작용"],"answer":"부생 수소는 정유·석유 화학 공정에서 부산물로 생산되어 저렴하지만, 공장 내 다른 공정에서 대부분 이용되므로 외부 공급량에 한계가 있다. 또한 화석 연료에 의존해 이산화 탄소가 발생한다. 추출 수소는 수소 생산 자체를 목적으로 하여 대량 공급에 유리하나 탄소 배출 문제가 있다. 이에 추출 과정의 이산화 탄소를 포집·처리하는 블루 수소를 중간 단계로 활용할 수 있다.\n\n수전해는 물을 전기 분해하여 수소를 얻는 방식이다. 그러나 (다)에서 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전히 친환경적이지 않다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.\n\n갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 해양 생태계의 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.\n\n인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 이에 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다."},{"id":"E04","title":"학교 환경 캠페인 자료 검토","intro":"학생회는 학교 환경 캠페인의 카드 뉴스와 온라인 자료를 검토한다.","blocks":[{"label":"발전 비중 자료","proposal":"2021년 석탄과 LPG 발전 비중이 60% 미만이고 신재생 에너지 비중이 2015년보다 줄었다고 소개한다.","task":"(가)의 발전 비중 그래프를 근거로 오류를 수정하고 비중 자료를 해석할 때 유의할 사항을 설명할 것.","answer":"(가)의 그래프에서 2021년 석탄 발전 비중은 34.3%, LPG는 29.2%로 합계가 63.5%이므로 60% 미만이라는 설명은 틀렸다. 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 상승했다. 따라서 수치를 정확히 고치고 그래프의 연도와 단위 및 출처를 밝혀야 한다. 비중만으로 절대적인 발전량의 변화까지 확정해서는 안 된다.","criteria":[{"text":"2021 석탄·LPG 합계","keys":["63.5","34.3","29.2"]},{"text":"신재생 비중 변화","keys":["3.7","7.5"]},{"text":"연도·출처·단위","keys":["출처","비중"]},{"text":"절대량 추론의 한계","keys":["절대","전체 발전량"]}],"p":"182"},{"label":"자료의 신뢰성과 공정성","proposal":"계절의 길이와 해수면 상승 수치의 출처를 생략하고 기후 변화는 오직 인위적 원인으로 발생한다고 설명한다.","task":"(가)의 댓글을 근거로 신뢰성과 공정성의 문제를 각각 지적하고 수정 방향을 제시할 것.","answer":"(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.","criteria":[{"text":"신뢰성·출처 누락","keys":["신뢰성","출처"]},{"text":"신뢰 가능한 자료 확인","keys":["확인","출처"]},{"text":"공정성·인위적 원인 편중","keys":["공정성","인위적"]},{"text":"자연·인위 원인 균형","keys":["자연적","균형"]}],"p":"178, 184"},{"label":"수소 분류","proposal":"부생·추출·수전해 수소와 그레이·블루·그린 수소가 정확히 일대일로 대응한다고 설명한다.","task":"(다)를 근거로 두 분류 기준을 구분하고 그레이·블루·그린 수소의 특징을 비교할 것.","answer":"부생·추출·수전해 수소는 생산 방법에 따른 구분인 반면 그레이·블루·그린 수소는 생산 과정의 온실가스 배출 특성에 따른 구분이므로 일대일 대응한다고 볼 수 없다. 그레이 수소는 화석 연료 이용 과정에서 발생한 이산화 탄소를 대기로 배출하고, 블루 수소는 이를 포집해 처리한다. 그린 수소는 신재생 에너지 전기로 수전해하여 생산한다.","criteria":[{"text":"두 분류 기준 구별","keys":["생산 방법","배출"]},{"text":"그레이 수소","keys":["그레이 수소","대기"]},{"text":"블루 수소","keys":["블루 수소","포집"]},{"text":"그린 수소","keys":["그린 수소","신재생"]}],"p":"186"},{"label":"디지털 매체 구성","proposal":"환경 지식이 부족한 청소년과 의견을 교환하려 하지만 긴 문자만 사용하고 관련 링크와 댓글을 차단한다.","task":"예상 수용자와 목적을 고려하여 복합양식성, 하이퍼텍스트, 쌍방향 상호 작용을 활용할 개선 방안을 제시할 것.","answer":"환경 지식이 부족한 청소년을 대상으로 한다면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다.","criteria":[{"text":"수용자 및 목적","keys":["청소년","이해"]},{"text":"복합양식성","keys":["복합양식성","영상"]},{"text":"하이퍼텍스트","keys":["하이퍼텍스트","링크"]},{"text":"쌍방향 상호 작용","keys":["쌍방향","댓글"]}],"p":"178, 180~184"}],"terms":["발전 비중","신뢰성","공정성","그레이 수소","블루 수소","그린 수소","복합양식성","하이퍼텍스트","쌍방향 상호 작용"],"answer":"(가)의 그래프에서 2021년 석탄 발전 비중은 34.3%, LPG는 29.2%로 합계가 63.5%이므로 60% 미만이라는 설명은 틀렸다. 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 상승했다. 이에 수치를 정확히 고치고 그래프의 연도와 단위 및 출처를 밝혀야 한다. 비중만으로 절대적인 발전량의 변화까지 확정해서는 안 된다.\n\n(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.\n\n부생·추출·수전해 수소는 생산 방법에 따른 구분인 반면 그레이·블루·그린 수소는 생산 과정의 온실가스 배출 특성에 따른 구분이므로 일대일 대응한다고 볼 수 없다. 그레이 수소는 화석 연료 이용 과정에서 발생한 이산화 탄소를 대기로 배출하고, 블루 수소는 이를 포집해 처리한다. 그린 수소는 신재생 에너지 전기로 수전해하여 생산한다.\n\n청소년 대상이라면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다."},{"id":"E05","title":"연안 친환경 산업단지 조성","intro":"산업단지의 에너지 공급과 탄소 감축 정책을 함께 마련한다.","blocks":[{"label":"전력 공급","proposal":"태양광·풍력 설비를 확대하지만 여름철 공급이 항상 충분하다고 보고 저장 설비를 제외한다.","task":"(가)를 근거로 발전 방식의 공통 장점과 한계를 밝히고 전력 공급을 보완할 방안을 설명할 것.","answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에 따르면 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 따라서 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.","criteria":[{"text":"발전 과정의 장점","keys":["공해","관여"]},{"text":"계절적 편차","keys":["계절적 편차","계절별"]},{"text":"여름 수요·발전량 불균형","keys":["여름","연평균"]},{"text":"ESS 활용","keys":["ESS","에너지 저장 시스템"]}],"p":"182"},{"label":"수소 공급","proposal":"가격이 저렴한 부생 수소만으로 급증하는 수소 수요를 모두 충당하고 별도의 공급 방식은 검토하지 않는다.","task":"(다)를 근거로 부생 수소의 장점과 공급 한계, 추출 수소의 장단점 및 현실적 전환 방안을 설명할 것.","answer":"부생 수소는 정유·석유 화학 공정에서 부산물로 생산되어 저렴하지만, 공장 내 다른 공정에서 대부분 이용되므로 외부 공급량에 한계가 있다. 또한 화석 연료에 의존해 이산화 탄소가 발생한다. 추출 수소는 수소 생산 자체를 목적으로 하여 대량 공급에 유리하나 탄소 배출 문제가 있다. 따라서 추출 과정의 이산화 탄소를 포집·처리하는 블루 수소를 중간 단계로 활용할 수 있다.","criteria":[{"text":"부생 수소의 부산물·저비용","keys":["부산물","저렴"]},{"text":"외부 공급량 제한","keys":["외부 공급","제한","한계"]},{"text":"추출 수소 대량 생산과 CO₂","keys":["추출 수소","대량","이산화 탄소"]},{"text":"블루 수소 중간 단계","keys":["블루 수소","포집"]}],"p":"186"},{"label":"배출권 거래","proposal":"기업의 부담을 줄이기 위해 배출권 구매 비용을 감축 설비 투자 비용보다 낮게 유지하고 이후 정부의 점검을 중단한다.","task":"(가)를 근거로 제도의 운영 원리, 해당 가격 정책의 한계 및 개선 방안을 서술할 것.","answer":"온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부 기관은 거래제의 운영을 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.","criteria":[{"text":"할당·거래","keys":["할당","거래"]},{"text":"비용 비교","keys":["구매","설비 투자"]},{"text":"감축 동기 저하","keys":["감축 동기","감축 노력"]},{"text":"지속적 점검 및 조정","keys":["점검","조정"]}],"p":"183~184"},{"label":"영상 자료 활용","proposal":"갯벌에서 산소가 발생하는 실험 장면과 연구원 인터뷰를 홍보 자료에 추가하고, 이를 근거로 전국 갯벌의 효과를 단정하려 한다.","task":"(나)를 근거로 실험 영상과 인터뷰 활용의 타당성을 설명하고 과장 방지 및 파급 효과를 고려할 사항을 서술할 것.","answer":"(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다.","criteria":[{"text":"실험 장면","keys":["실험","기체 방울"]},{"text":"연구원 인터뷰와 이해 효과","keys":["연구원","이해"]},{"text":"자료의 범위·과장 방지","keys":["확정","과장","단정"]},{"text":"파급 효과 및 출처","keys":["파급 효과","출처"]}],"p":"178, 185"}],"terms":["에너지 저장 시스템","ESS","계절적 편차","부생 수소","추출 수소","블루 수소","온실가스 배출권 거래제","감축 동기","파급 효과","규조류"],"answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에서 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 이에 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.\n\n부생 수소는 정유·석유 화학 공정에서 부산물로 생산되어 저렴하지만, 공장 내 다른 공정에서 대부분 이용되므로 외부 공급량에 한계가 있다. 또한 화석 연료에 의존해 이산화 탄소가 발생한다. 추출 수소는 수소 생산 자체를 목적으로 하여 대량 공급에 유리하나 탄소 배출 문제가 있다. 이에 추출 과정의 이산화 탄소를 포집·처리하는 블루 수소를 중간 단계로 활용할 수 있다.\n\n온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부는 거래제를 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.\n\n(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다."},{"id":"E06","title":"기후 위기 시민 설명회","intro":"시민을 위한 환경 기술 설명 자료와 소통 방식을 설계한다.","blocks":[{"label":"액화 수소","proposal":"액화하면 부피가 줄어들어 저장·운송에 유리하므로 모든 비용이 저렴하다고 홍보하고 곧바로 전면 보급한다.","task":"(가)를 근거로 액화 조건, 부피 변화, 활용의 장점과 비용상의 한계를 설명할 것.","answer":"(가)에 따르면 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 따라서 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.","criteria":[{"text":"영하 253도","keys":["253","영하"]},{"text":"약 1/800 부피","keys":["800","부피"]},{"text":"저장과 운송","keys":["저장","운송"]},{"text":"액화 비용 및 검토","keys":["액화 비용","비용"]}],"p":"183"},{"label":"수소 분류","proposal":"부생·추출·수전해 수소와 그레이·블루·그린 수소가 정확히 일대일로 대응한다고 설명한다.","task":"(다)를 근거로 두 분류 기준을 구분하고 그레이·블루·그린 수소의 특징을 비교할 것.","answer":"부생·추출·수전해 수소는 생산 방법에 따른 구분인 반면 그레이·블루·그린 수소는 생산 과정의 온실가스 배출 특성에 따른 구분이므로 일대일 대응한다고 볼 수 없다. 그레이 수소는 화석 연료 이용 과정에서 발생한 이산화 탄소를 대기로 배출하고, 블루 수소는 이를 포집해 처리한다. 그린 수소는 신재생 에너지 전기로 수전해하여 생산한다.","criteria":[{"text":"두 분류 기준 구별","keys":["생산 방법","배출"]},{"text":"그레이 수소","keys":["그레이 수소","대기"]},{"text":"블루 수소","keys":["블루 수소","포집"]},{"text":"그린 수소","keys":["그린 수소","신재생"]}],"p":"186"},{"label":"갯벌 복원","proposal":"훼손된 연안 갯벌을 복원하고 규조류가 살아갈 수 있는 건강한 생태계를 유지한다.","task":"(나)를 근거로 갯벌 복원이 타당한 이유를 광합성, 탄소 이동 경로, 블루 카본을 포함해 설명할 것.","answer":"갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 이처럼 해양 생태계가 저장하는 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.","criteria":[{"text":"규조류·광합성","keys":["규조류","광합성"]},{"text":"이산화 탄소 흡수·산소 배출","keys":["이산화 탄소","산소"]},{"text":"먹이 관계와 탄소 저장","keys":["먹","다른 생물","갯벌"]},{"text":"블루 카본 및 감축","keys":["블루 카본","감축"]}],"p":"185"},{"label":"홍보 매체","proposal":"종이 소식지만으로 시민들의 의견을 실시간 수렴하고 정책의 미비점을 즉시 반영하려 한다.","task":"인쇄 매체의 한계와 홍보 목적을 연결하여 평가하고, 디지털 매체를 활용한 대안을 제시할 것.","answer":"인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 따라서 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다.","criteria":[{"text":"인쇄 매체","keys":["인쇄 매체","종이"]},{"text":"실시간 전달·상호 작용 한계","keys":["실시간","한계"]},{"text":"디지털 대안","keys":["디지털 매체","누리집","블로그"]},{"text":"쌍방향 의견 수렴","keys":["쌍방향","댓글","게시판"]}],"p":"178"}],"terms":["액화 수소","그레이 수소","블루 수소","그린 수소","규조류","블루 카본","인쇄 매체","쌍방향 상호 작용"],"answer":"(가)에서 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 이에 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.\n\n부생·추출·수전해 수소는 생산 방법에 따른 구분인 반면 그레이·블루·그린 수소는 생산 과정의 온실가스 배출 특성에 따른 구분이므로 일대일 대응한다고 볼 수 없다. 그레이 수소는 화석 연료 이용 과정에서 발생한 이산화 탄소를 대기로 배출하고, 블루 수소는 이를 포집해 처리한다. 그린 수소는 신재생 에너지 전기로 수전해하여 생산한다.\n\n갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 해양 생태계의 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.\n\n인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 이에 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다."},{"id":"E07","title":"신재생 에너지 홍보 영상","intro":"지역 방송반이 온라인 환경 영상을 제작한다.","blocks":[{"label":"전력 공급","proposal":"태양광·풍력 설비를 확대하지만 여름철 공급이 항상 충분하다고 보고 저장 설비를 제외한다.","task":"(가)를 근거로 발전 방식의 공통 장점과 한계를 밝히고 전력 공급을 보완할 방안을 설명할 것.","answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에 따르면 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 따라서 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.","criteria":[{"text":"발전 과정의 장점","keys":["공해","관여"]},{"text":"계절적 편차","keys":["계절적 편차","계절별"]},{"text":"여름 수요·발전량 불균형","keys":["여름","연평균"]},{"text":"ESS 활용","keys":["ESS","에너지 저장 시스템"]}],"p":"182"},{"label":"수전해 전환","proposal":"화석 연료로 생산한 전기를 사용하더라도 수전해는 완전한 친환경 방식이므로 즉시 전면 전환할 계획이다.","task":"(다)를 근거로 수전해의 원리와 친환경성 조건, 경제적 한계 및 중간 단계의 보완 방안을 설명할 것.","answer":"수전해는 물을 전기 분해하여 수소를 생산하는 방식이다. 그러나 (다)에 따르면 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전한 친환경 방식이라고 보기 어렵다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.","criteria":[{"text":"수전해 원리","keys":["전기 분해","전기분해"]},{"text":"화석 연료 전기 조건","keys":["화석 연료","전기"]},{"text":"그린 수소 비용","keys":["그린 수소","비용"]},{"text":"블루 수소·포집","keys":["블루 수소","포집"]}],"p":"186"},{"label":"자료의 신뢰성과 공정성","proposal":"계절의 길이와 해수면 상승 수치의 출처를 생략하고 기후 변화는 오직 인위적 원인으로 발생한다고 설명한다.","task":"(가)의 댓글을 근거로 신뢰성과 공정성의 문제를 각각 지적하고 수정 방향을 제시할 것.","answer":"(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.","criteria":[{"text":"신뢰성·출처 누락","keys":["신뢰성","출처"]},{"text":"신뢰 가능한 자료 확인","keys":["확인","출처"]},{"text":"공정성·인위적 원인 편중","keys":["공정성","인위적"]},{"text":"자연·인위 원인 균형","keys":["자연적","균형"]}],"p":"178, 184"},{"label":"영상 자료 활용","proposal":"갯벌에서 산소가 발생하는 실험 장면과 연구원 인터뷰를 홍보 자료에 추가하고, 이를 근거로 전국 갯벌의 효과를 단정하려 한다.","task":"(나)를 근거로 실험 영상과 인터뷰 활용의 타당성을 설명하고 과장 방지 및 파급 효과를 고려할 사항을 서술할 것.","answer":"(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다.","criteria":[{"text":"실험 장면","keys":["실험","기체 방울"]},{"text":"연구원 인터뷰와 이해 효과","keys":["연구원","이해"]},{"text":"자료의 범위·과장 방지","keys":["확정","과장","단정"]},{"text":"파급 효과 및 출처","keys":["파급 효과","출처"]}],"p":"178, 185"}],"terms":["에너지 저장 시스템","ESS","계절적 편차","수전해","그린 수소","블루 수소","신뢰성","공정성","파급 효과","규조류"],"answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에서 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 이에 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.\n\n수전해는 물을 전기 분해하여 수소를 얻는 방식이다. 그러나 (다)에서 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전히 친환경적이지 않다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.\n\n(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.\n\n(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다."},{"id":"E08","title":"그린 수소 전환 지원 사업","intro":"시청은 수소 산업을 확대하고 주민에게 정책의 효과를 안내하려 한다.","blocks":[{"label":"수소 공급","proposal":"가격이 저렴한 부생 수소만으로 급증하는 수소 수요를 모두 충당하고 별도의 공급 방식은 검토하지 않는다.","task":"(다)를 근거로 부생 수소의 장점과 공급 한계, 추출 수소의 장단점 및 현실적 전환 방안을 설명할 것.","answer":"부생 수소는 정유·석유 화학 공정에서 부산물로 생산되어 저렴하지만, 공장 내 다른 공정에서 대부분 이용되므로 외부 공급량에 한계가 있다. 또한 화석 연료에 의존해 이산화 탄소가 발생한다. 추출 수소는 수소 생산 자체를 목적으로 하여 대량 공급에 유리하나 탄소 배출 문제가 있다. 따라서 추출 과정의 이산화 탄소를 포집·처리하는 블루 수소를 중간 단계로 활용할 수 있다.","criteria":[{"text":"부생 수소의 부산물·저비용","keys":["부산물","저렴"]},{"text":"외부 공급량 제한","keys":["외부 공급","제한","한계"]},{"text":"추출 수소 대량 생산과 CO₂","keys":["추출 수소","대량","이산화 탄소"]},{"text":"블루 수소 중간 단계","keys":["블루 수소","포집"]}],"p":"186"},{"label":"액화 수소","proposal":"액화하면 부피가 줄어들어 저장·운송에 유리하므로 모든 비용이 저렴하다고 홍보하고 곧바로 전면 보급한다.","task":"(가)를 근거로 액화 조건, 부피 변화, 활용의 장점과 비용상의 한계를 설명할 것.","answer":"(가)에 따르면 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 따라서 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.","criteria":[{"text":"영하 253도","keys":["253","영하"]},{"text":"약 1/800 부피","keys":["800","부피"]},{"text":"저장과 운송","keys":["저장","운송"]},{"text":"액화 비용 및 검토","keys":["액화 비용","비용"]}],"p":"183"},{"label":"배출권 거래","proposal":"기업의 부담을 줄이기 위해 배출권 구매 비용을 감축 설비 투자 비용보다 낮게 유지하고 이후 정부의 점검을 중단한다.","task":"(가)를 근거로 제도의 운영 원리, 해당 가격 정책의 한계 및 개선 방안을 서술할 것.","answer":"온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부 기관은 거래제의 운영을 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.","criteria":[{"text":"할당·거래","keys":["할당","거래"]},{"text":"비용 비교","keys":["구매","설비 투자"]},{"text":"감축 동기 저하","keys":["감축 동기","감축 노력"]},{"text":"지속적 점검 및 조정","keys":["점검","조정"]}],"p":"183~184"},{"label":"디지털 매체 구성","proposal":"환경 지식이 부족한 청소년과 의견을 교환하려 하지만 긴 문자만 사용하고 관련 링크와 댓글을 차단한다.","task":"예상 수용자와 목적을 고려하여 복합양식성, 하이퍼텍스트, 쌍방향 상호 작용을 활용할 개선 방안을 제시할 것.","answer":"환경 지식이 부족한 청소년을 대상으로 한다면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다.","criteria":[{"text":"수용자 및 목적","keys":["청소년","이해"]},{"text":"복합양식성","keys":["복합양식성","영상"]},{"text":"하이퍼텍스트","keys":["하이퍼텍스트","링크"]},{"text":"쌍방향 상호 작용","keys":["쌍방향","댓글"]}],"p":"178, 180~184"}],"terms":["부생 수소","추출 수소","블루 수소","액화 수소","온실가스 배출권 거래제","감축 동기","복합양식성","하이퍼텍스트","쌍방향 상호 작용"],"answer":"부생 수소는 정유·석유 화학 공정에서 부산물로 생산되어 저렴하지만, 공장 내 다른 공정에서 대부분 이용되므로 외부 공급량에 한계가 있다. 또한 화석 연료에 의존해 이산화 탄소가 발생한다. 추출 수소는 수소 생산 자체를 목적으로 하여 대량 공급에 유리하나 탄소 배출 문제가 있다. 이에 추출 과정의 이산화 탄소를 포집·처리하는 블루 수소를 중간 단계로 활용할 수 있다.\n\n(가)에서 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 이에 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.\n\n온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부는 거래제를 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.\n\n청소년 대상이라면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다."},{"id":"E09","title":"갯벌과 에너지 통합 교육","intro":"교육 기관은 환경 관련 배경지식이 부족한 청소년을 대상으로 자료를 만든다.","blocks":[{"label":"발전 비중 자료","proposal":"2021년 석탄과 LPG 발전 비중이 60% 미만이고 신재생 에너지 비중이 2015년보다 줄었다고 소개한다.","task":"(가)의 발전 비중 그래프를 근거로 오류를 수정하고 비중 자료를 해석할 때 유의할 사항을 설명할 것.","answer":"(가)의 그래프에서 2021년 석탄 발전 비중은 34.3%, LPG는 29.2%로 합계가 63.5%이므로 60% 미만이라는 설명은 틀렸다. 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 상승했다. 따라서 수치를 정확히 고치고 그래프의 연도와 단위 및 출처를 밝혀야 한다. 비중만으로 절대적인 발전량의 변화까지 확정해서는 안 된다.","criteria":[{"text":"2021 석탄·LPG 합계","keys":["63.5","34.3","29.2"]},{"text":"신재생 비중 변화","keys":["3.7","7.5"]},{"text":"연도·출처·단위","keys":["출처","비중"]},{"text":"절대량 추론의 한계","keys":["절대","전체 발전량"]}],"p":"182"},{"label":"갯벌 복원","proposal":"훼손된 연안 갯벌을 복원하고 규조류가 살아갈 수 있는 건강한 생태계를 유지한다.","task":"(나)를 근거로 갯벌 복원이 타당한 이유를 광합성, 탄소 이동 경로, 블루 카본을 포함해 설명할 것.","answer":"갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 이처럼 해양 생태계가 저장하는 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.","criteria":[{"text":"규조류·광합성","keys":["규조류","광합성"]},{"text":"이산화 탄소 흡수·산소 배출","keys":["이산화 탄소","산소"]},{"text":"먹이 관계와 탄소 저장","keys":["먹","다른 생물","갯벌"]},{"text":"블루 카본 및 감축","keys":["블루 카본","감축"]}],"p":"185"},{"label":"수전해 전환","proposal":"화석 연료로 생산한 전기를 사용하더라도 수전해는 완전한 친환경 방식이므로 즉시 전면 전환할 계획이다.","task":"(다)를 근거로 수전해의 원리와 친환경성 조건, 경제적 한계 및 중간 단계의 보완 방안을 설명할 것.","answer":"수전해는 물을 전기 분해하여 수소를 생산하는 방식이다. 그러나 (다)에 따르면 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전한 친환경 방식이라고 보기 어렵다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.","criteria":[{"text":"수전해 원리","keys":["전기 분해","전기분해"]},{"text":"화석 연료 전기 조건","keys":["화석 연료","전기"]},{"text":"그린 수소 비용","keys":["그린 수소","비용"]},{"text":"블루 수소·포집","keys":["블루 수소","포집"]}],"p":"186"},{"label":"디지털 매체 구성","proposal":"환경 지식이 부족한 청소년과 의견을 교환하려 하지만 긴 문자만 사용하고 관련 링크와 댓글을 차단한다.","task":"예상 수용자와 목적을 고려하여 복합양식성, 하이퍼텍스트, 쌍방향 상호 작용을 활용할 개선 방안을 제시할 것.","answer":"환경 지식이 부족한 청소년을 대상으로 한다면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다.","criteria":[{"text":"수용자 및 목적","keys":["청소년","이해"]},{"text":"복합양식성","keys":["복합양식성","영상"]},{"text":"하이퍼텍스트","keys":["하이퍼텍스트","링크"]},{"text":"쌍방향 상호 작용","keys":["쌍방향","댓글"]}],"p":"178, 180~184"}],"terms":["발전 비중","신뢰성","규조류","블루 카본","수전해","그린 수소","블루 수소","복합양식성","하이퍼텍스트","쌍방향 상호 작용"],"answer":"(가)의 그래프에서 2021년 석탄 발전 비중은 34.3%, LPG는 29.2%로 합계가 63.5%이므로 60% 미만이라는 설명은 틀렸다. 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 상승했다. 이에 수치를 정확히 고치고 그래프의 연도와 단위 및 출처를 밝혀야 한다. 비중만으로 절대적인 발전량의 변화까지 확정해서는 안 된다.\n\n갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 해양 생태계의 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.\n\n수전해는 물을 전기 분해하여 수소를 얻는 방식이다. 그러나 (다)에서 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전히 친환경적이지 않다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.\n\n청소년 대상이라면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다."},{"id":"E10","title":"에너지 정책 보도 검토","intro":"지역 언론사가 산업 정책을 보도하고 시민의 의견을 받는다.","blocks":[{"label":"발전 비중 자료","proposal":"2021년 석탄과 LPG 발전 비중이 60% 미만이고 신재생 에너지 비중이 2015년보다 줄었다고 소개한다.","task":"(가)의 발전 비중 그래프를 근거로 오류를 수정하고 비중 자료를 해석할 때 유의할 사항을 설명할 것.","answer":"(가)의 그래프에서 2021년 석탄 발전 비중은 34.3%, LPG는 29.2%로 합계가 63.5%이므로 60% 미만이라는 설명은 틀렸다. 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 상승했다. 따라서 수치를 정확히 고치고 그래프의 연도와 단위 및 출처를 밝혀야 한다. 비중만으로 절대적인 발전량의 변화까지 확정해서는 안 된다.","criteria":[{"text":"2021 석탄·LPG 합계","keys":["63.5","34.3","29.2"]},{"text":"신재생 비중 변화","keys":["3.7","7.5"]},{"text":"연도·출처·단위","keys":["출처","비중"]},{"text":"절대량 추론의 한계","keys":["절대","전체 발전량"]}],"p":"182"},{"label":"배출권 거래","proposal":"기업의 부담을 줄이기 위해 배출권 구매 비용을 감축 설비 투자 비용보다 낮게 유지하고 이후 정부의 점검을 중단한다.","task":"(가)를 근거로 제도의 운영 원리, 해당 가격 정책의 한계 및 개선 방안을 서술할 것.","answer":"온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부 기관은 거래제의 운영을 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.","criteria":[{"text":"할당·거래","keys":["할당","거래"]},{"text":"비용 비교","keys":["구매","설비 투자"]},{"text":"감축 동기 저하","keys":["감축 동기","감축 노력"]},{"text":"지속적 점검 및 조정","keys":["점검","조정"]}],"p":"183~184"},{"label":"자료의 신뢰성과 공정성","proposal":"계절의 길이와 해수면 상승 수치의 출처를 생략하고 기후 변화는 오직 인위적 원인으로 발생한다고 설명한다.","task":"(가)의 댓글을 근거로 신뢰성과 공정성의 문제를 각각 지적하고 수정 방향을 제시할 것.","answer":"(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.","criteria":[{"text":"신뢰성·출처 누락","keys":["신뢰성","출처"]},{"text":"신뢰 가능한 자료 확인","keys":["확인","출처"]},{"text":"공정성·인위적 원인 편중","keys":["공정성","인위적"]},{"text":"자연·인위 원인 균형","keys":["자연적","균형"]}],"p":"178, 184"},{"label":"홍보 매체","proposal":"종이 소식지만으로 시민들의 의견을 실시간 수렴하고 정책의 미비점을 즉시 반영하려 한다.","task":"인쇄 매체의 한계와 홍보 목적을 연결하여 평가하고, 디지털 매체를 활용한 대안을 제시할 것.","answer":"인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 따라서 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다.","criteria":[{"text":"인쇄 매체","keys":["인쇄 매체","종이"]},{"text":"실시간 전달·상호 작용 한계","keys":["실시간","한계"]},{"text":"디지털 대안","keys":["디지털 매체","누리집","블로그"]},{"text":"쌍방향 의견 수렴","keys":["쌍방향","댓글","게시판"]}],"p":"178"}],"terms":["발전 비중","신뢰성","온실가스 배출권 거래제","감축 동기","공정성","인쇄 매체","쌍방향 상호 작용"],"answer":"(가)의 그래프에서 2021년 석탄 발전 비중은 34.3%, LPG는 29.2%로 합계가 63.5%이므로 60% 미만이라는 설명은 틀렸다. 신재생 에너지 비중은 2015년 3.7%에서 2021년 7.5%로 상승했다. 이에 수치를 정확히 고치고 그래프의 연도와 단위 및 출처를 밝혀야 한다. 비중만으로 절대적인 발전량의 변화까지 확정해서는 안 된다.\n\n온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부는 거래제를 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.\n\n(가)의 댓글에서는 계절 길이와 연안 해수면 상승 수치의 출처를 묻고, 기후 변화의 원인이 인위적 원인만 있는 것처럼 오해할 수 있음을 지적한다. 출처가 누락된 수치는 정보의 신뢰성을 낮출 수 있으므로 신뢰할 만한 자료에서 확인하고 출처를 밝혀야 한다. 또한 자연적 원인과 인위적 원인을 균형 있게 제시하여 공정성을 높여야 한다.\n\n인쇄 매체인 종이 소식지는 시간적·공간적으로 분리된 필자와 독자가 간접적으로 소통하는 데 적합하지만 실시간 전달과 상호 작용에는 한계가 있다. 이에 실시간 의견 수렴이라는 목적에 충분히 부합하지 않는다. 디지털 매체인 누리집이나 블로그를 함께 운영하고 댓글과 게시판으로 쌍방향 상호 작용을 활성화해 시민의 의견을 정책 보완에 반영할 수 있다."},{"id":"E11","title":"환경 기술 박람회 자료 심사","intro":"박람회에서 수소 기술과 갯벌의 환경적 역할을 소개한다.","blocks":[{"label":"액화 수소","proposal":"액화하면 부피가 줄어들어 저장·운송에 유리하므로 모든 비용이 저렴하다고 홍보하고 곧바로 전면 보급한다.","task":"(가)를 근거로 액화 조건, 부피 변화, 활용의 장점과 비용상의 한계를 설명할 것.","answer":"(가)에 따르면 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 따라서 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.","criteria":[{"text":"영하 253도","keys":["253","영하"]},{"text":"약 1/800 부피","keys":["800","부피"]},{"text":"저장과 운송","keys":["저장","운송"]},{"text":"액화 비용 및 검토","keys":["액화 비용","비용"]}],"p":"183"},{"label":"수소 분류","proposal":"부생·추출·수전해 수소와 그레이·블루·그린 수소가 정확히 일대일로 대응한다고 설명한다.","task":"(다)를 근거로 두 분류 기준을 구분하고 그레이·블루·그린 수소의 특징을 비교할 것.","answer":"부생·추출·수전해 수소는 생산 방법에 따른 구분인 반면 그레이·블루·그린 수소는 생산 과정의 온실가스 배출 특성에 따른 구분이므로 일대일 대응한다고 볼 수 없다. 그레이 수소는 화석 연료 이용 과정에서 발생한 이산화 탄소를 대기로 배출하고, 블루 수소는 이를 포집해 처리한다. 그린 수소는 신재생 에너지 전기로 수전해하여 생산한다.","criteria":[{"text":"두 분류 기준 구별","keys":["생산 방법","배출"]},{"text":"그레이 수소","keys":["그레이 수소","대기"]},{"text":"블루 수소","keys":["블루 수소","포집"]},{"text":"그린 수소","keys":["그린 수소","신재생"]}],"p":"186"},{"label":"갯벌 복원","proposal":"훼손된 연안 갯벌을 복원하고 규조류가 살아갈 수 있는 건강한 생태계를 유지한다.","task":"(나)를 근거로 갯벌 복원이 타당한 이유를 광합성, 탄소 이동 경로, 블루 카본을 포함해 설명할 것.","answer":"갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 이처럼 해양 생태계가 저장하는 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.","criteria":[{"text":"규조류·광합성","keys":["규조류","광합성"]},{"text":"이산화 탄소 흡수·산소 배출","keys":["이산화 탄소","산소"]},{"text":"먹이 관계와 탄소 저장","keys":["먹","다른 생물","갯벌"]},{"text":"블루 카본 및 감축","keys":["블루 카본","감축"]}],"p":"185"},{"label":"영상 자료 활용","proposal":"갯벌에서 산소가 발생하는 실험 장면과 연구원 인터뷰를 홍보 자료에 추가하고, 이를 근거로 전국 갯벌의 효과를 단정하려 한다.","task":"(나)를 근거로 실험 영상과 인터뷰 활용의 타당성을 설명하고 과장 방지 및 파급 효과를 고려할 사항을 서술할 것.","answer":"(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다.","criteria":[{"text":"실험 장면","keys":["실험","기체 방울"]},{"text":"연구원 인터뷰와 이해 효과","keys":["연구원","이해"]},{"text":"자료의 범위·과장 방지","keys":["확정","과장","단정"]},{"text":"파급 효과 및 출처","keys":["파급 효과","출처"]}],"p":"178, 185"}],"terms":["액화 수소","그레이 수소","블루 수소","그린 수소","규조류","블루 카본","파급 효과"],"answer":"(가)에서 수소를 영하 253도 이하로 냉각하면 액화되며 부피가 기체의 약 800분의 1로 줄어든다. 이 때문에 저장과 운송이 유리하고 온도 변화만으로 기화해 연료로 활용할 수 있다. 그러나 액화 과정에 많은 비용이 드는 단점이 있다. 이에 물류 효율만으로 모든 비용이 저렴하다고 단정하지 말고 액화 비용을 포함하여 경제성을 검토하고 상용화 연구를 병행해야 한다.\n\n부생·추출·수전해 수소는 생산 방법에 따른 구분인 반면 그레이·블루·그린 수소는 생산 과정의 온실가스 배출 특성에 따른 구분이므로 일대일 대응한다고 볼 수 없다. 그레이 수소는 화석 연료 이용 과정에서 발생한 이산화 탄소를 대기로 배출하고, 블루 수소는 이를 포집해 처리한다. 그린 수소는 신재생 에너지 전기로 수전해하여 생산한다.\n\n갯벌 복원은 타당하다. (나)의 실험에서 건강한 펄에 빛을 쬐자 규조류의 광합성으로 산소가 발생했다. 규조류는 대기 중 이산화 탄소를 흡수하여 산소를 배출하고 탄소를 저장한다. 저장된 탄소는 규조류를 먹는 다른 생물의 몸에 들어가거나 갯벌에 갇힌다. 해양 생태계의 블루 카본은 온실가스 감축에 기여하므로 건강한 갯벌의 유지가 필요하다.\n\n(나)처럼 건강한 펄에 빛을 비추었을 때 기체 방울이 발생하는 실험을 보여 주고 연구원의 설명을 덧붙이면 규조류의 광합성과 산소 생성 원리를 구체적으로 이해하도록 돕는다. 다만 해당 관찰만으로 전국 갯벌의 탄소 저장량을 확정할 수는 없다. 디지털 매체의 정보는 널리 퍼질 수 있으므로 파급 효과를 고려해 출처를 밝히고 과장된 표현을 수정해야 한다."},{"id":"E12","title":"탄소 중립 청소년 제안서","intro":"청소년 정책단은 에너지 전환 및 홍보의 개선안을 검토한다.","blocks":[{"label":"전력 공급","proposal":"태양광·풍력 설비를 확대하지만 여름철 공급이 항상 충분하다고 보고 저장 설비를 제외한다.","task":"(가)를 근거로 발전 방식의 공통 장점과 한계를 밝히고 전력 공급을 보완할 방안을 설명할 것.","answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에 따르면 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 따라서 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.","criteria":[{"text":"발전 과정의 장점","keys":["공해","관여"]},{"text":"계절적 편차","keys":["계절적 편차","계절별"]},{"text":"여름 수요·발전량 불균형","keys":["여름","연평균"]},{"text":"ESS 활용","keys":["ESS","에너지 저장 시스템"]}],"p":"182"},{"label":"수전해 전환","proposal":"화석 연료로 생산한 전기를 사용하더라도 수전해는 완전한 친환경 방식이므로 즉시 전면 전환할 계획이다.","task":"(다)를 근거로 수전해의 원리와 친환경성 조건, 경제적 한계 및 중간 단계의 보완 방안을 설명할 것.","answer":"수전해는 물을 전기 분해하여 수소를 생산하는 방식이다. 그러나 (다)에 따르면 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전한 친환경 방식이라고 보기 어렵다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.","criteria":[{"text":"수전해 원리","keys":["전기 분해","전기분해"]},{"text":"화석 연료 전기 조건","keys":["화석 연료","전기"]},{"text":"그린 수소 비용","keys":["그린 수소","비용"]},{"text":"블루 수소·포집","keys":["블루 수소","포집"]}],"p":"186"},{"label":"배출권 거래","proposal":"기업의 부담을 줄이기 위해 배출권 구매 비용을 감축 설비 투자 비용보다 낮게 유지하고 이후 정부의 점검을 중단한다.","task":"(가)를 근거로 제도의 운영 원리, 해당 가격 정책의 한계 및 개선 방안을 서술할 것.","answer":"온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부 기관은 거래제의 운영을 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.","criteria":[{"text":"할당·거래","keys":["할당","거래"]},{"text":"비용 비교","keys":["구매","설비 투자"]},{"text":"감축 동기 저하","keys":["감축 동기","감축 노력"]},{"text":"지속적 점검 및 조정","keys":["점검","조정"]}],"p":"183~184"},{"label":"디지털 매체 구성","proposal":"환경 지식이 부족한 청소년과 의견을 교환하려 하지만 긴 문자만 사용하고 관련 링크와 댓글을 차단한다.","task":"예상 수용자와 목적을 고려하여 복합양식성, 하이퍼텍스트, 쌍방향 상호 작용을 활용할 개선 방안을 제시할 것.","answer":"환경 지식이 부족한 청소년을 대상으로 한다면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다.","criteria":[{"text":"수용자 및 목적","keys":["청소년","이해"]},{"text":"복합양식성","keys":["복합양식성","영상"]},{"text":"하이퍼텍스트","keys":["하이퍼텍스트","링크"]},{"text":"쌍방향 상호 작용","keys":["쌍방향","댓글"]}],"p":"178, 180~184"}],"terms":["에너지 저장 시스템","ESS","계절적 편차","수전해","그린 수소","블루 수소","온실가스 배출권 거래제","감축 동기","복합양식성","하이퍼텍스트","쌍방향 상호 작용"],"answer":"태양광과 풍력은 발전 과정에서 공해가 발생하지 않고 설비를 갖추면 사람이 계속 관여하지 않아도 된다는 장점이 있다. 그러나 (가)에서 전력 수요가 높은 여름철의 발전량은 연평균에 미치지 못하는 계절적 편차가 있다. 이에 안정적 공급을 위해 에너지 저장 시스템(ESS)을 활용해 전력이 부족한 시기에 저장한 에너지를 공급해야 한다.\n\n수전해는 물을 전기 분해하여 수소를 얻는 방식이다. 그러나 (다)에서 전기 분해에 사용된 전기가 화석 연료로 생산되었다면 완전히 친환경적이지 않다. 신재생 에너지 전기를 이용한 그린 수소는 온실가스 배출을 줄이는 목표에 부합하지만 높은 생산 비용이 한계이다. 경제성이 확보되기까지 추출 과정의 탄소를 포집해 처리하는 블루 수소를 중간 단계로 활용해야 한다.\n\n온실가스 배출권 거래제는 정부가 기업에 배출량을 할당하고 여분이나 부족분에 대해 거래를 허용하는 제도이다. 그러나 (가)에서 지적하듯 배출권 구매가 감축 설비 투자보다 저렴하면 기업은 설비 투자보다 구매를 선호할 수 있다. 이로 인해 실질적인 감축 동기가 약해질 수 있으므로 정부는 거래제를 지속적으로 점검하고 가격과 할당 등을 조정해야 한다.\n\n청소년 대상이라면 긴 문자만 나열하는 방식은 이해를 어렵게 할 수 있다. 디지털 매체의 복합양식성을 활용해 문자와 그래프, 영상, 음성 해설을 결합하고 하이퍼텍스트 구조로 신뢰할 만한 관련 자료를 연결해야 한다. 댓글이나 게시판을 이용한 쌍방향 상호 작용으로 수용자의 질문과 의견을 수렴하면 제작 목적을 효과적으로 달성할 수 있다."}],"drills":["K0561","K0562","K0563","K0564","K0565","K0566","K0567","K0568","K0569","K0570","K0571","K0572","K0573","K0574","K0575","K0576","K0577","K0578","K0579","K0580","K0581","K0582","K0583","K0584","K0585","K0586","K0587","K0588","K0589","K0590","K0591","K0592","K0593","K0594","K0595","K0596","K0597","K0598","K0599","K0600","K0601","K0602","K0603","K0604","K0605","K0606","K0607","K0608","K0609","K0610","K0611","K0612","K0613","K0614","K0615","K0616","K0617","K0618","K0619","K0620","K0621","K0622","K0623","K0624","K0625","K0626","K0627","K0628","K0629","K0630","K0631","K0632","K0633","K0634","K0635","K0636","K0637","K0638","K0639","K0640","K0641","K0642","K0643","K0644","K0645","K0646","K0647","K0648","K0649","K0650","K0651","K0652","K0653","K0654","K0655","K0656","K0657","K0658","K0659","K0660","K0661","K0662","K0663","K0664","K0665","K0666","K0667","K0668","K0669","K0670","K0671","K0672","K0673","K0674","K0675","K0676","K0677","K0678","K0679","K0680","K0681","K0682","K0683","K0684","K0685","K0686","K0687","K0688","K0689","K0690","K0691","K0692","K0693","K0694","K0695","K0696","K0697","K0698","K0699","K0700","K0701","K0702","K0703","K0704","K0705","K0706","K0707","K0708","K0709","K0710"],"base":650}</script><script type="application/json" id="kl-sql">[{"title":"국어 전용 스키마·테이블","sql":"begin;\ncreate schema if not exists kl1;\nrevoke all on schema kl1 from public, anon, authenticated;\ncreate table if not exists kl1.bank(id text primary key, kind text not null, mode text not null, level text not null, form integer, points integer not null default 0, answer jsonb not null);\ncreate table if not exists kl1.profiles(uid uuid primary key references auth.users(id) on delete (regexp_replace(normalize(coalesce(p_text,''),NFKC),'[[:space:][:punct:]]','','g')) $$;\ncreate or replace function kl1.valid(b kl1.bank,a jsonb) returns boolean language plpgsql immutable set search_path=pg_catalog as $$\nbegin\n if a is null or a='null'::jsonb then return false; end if;\n if b.mode='fill' then return jsonb_typeof(a)='string' and length(a#>>'{}') between 1 and 300; end if;\n if b.mode='order' then return jsonb_typeof(a)='array' and jsonb_array_length(a)=jsonb_array_length(b.answer) and not exists(select 1 from jsonb_array_elements(a) x where jsonb_typeof(x)\u003c>'number'); end if;\n return jsonb_typeof(a)='number' and (a#>>'{}') ~ '^[0-4]$' and (b.mode\u003c>'ox' or (a#>>'{}') in ('0','1'));\nend $$;\ncreate or replace function kl1.is_correct(b kl1.bank,a jsonb) returns boolean language sql immutable set search_path=pg_catalog as $$ select case when b.mode='fill' then kl1.norm(a#>>'{}')=kl1.norm(b.answer#>>'{}') else a=b.answer end $$;\ncreate or replace function public.kl1_profile(p_nickname text,p_avatar text,p_title text) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); n text:=btrim(p_nickname);\nbegin\n if me is null then raise exception '로그인이 필요합니다.'; end if;\n if n is null or char_length(n) not between 1 and 20 or n ~ '[[:cntrl:]]' then raise exception '닉네임은 1~20자입니다.'; end if;\n insert into kl1.profiles(uid,nickname,avatar,title) values(me,n,case when p_avatar in ('📚','🐼','🦊','🐉','🌱','🎓','🦉','🌙') then p_avatar else '📚' end,case when p_title in ('학습 시작','독해 탐험가','논술 연구자','고난도 도전자') then p_title else '학습 시작' end) on conflict(uid) do update set nickname=excluded.nickname,avatar=excluded.avatar,title=excluded.title;\n return jsonb_build_object('ok',true);\nend $$;\nrevoke all on function kl1.norm(text),kl1.valid(kl1.bank,jsonb),kl1.is_correct(kl1.bank,jsonb) from public,anon,authenticated;\nrevoke all on function public.kl1_profile(text,text,text) from public,anon; grant execute on function public.kl1_profile(text,text,text) to authenticated;"},{"title":"학습 및 시험 제출 함수","sql":"create or replace function public.kl1_record(p_items jsonb) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); x jsonb; b kl1.bank%rowtype; n integer:=0; rid text;\nbegin\n if me is null or not exists(select 1 from kl1.profiles where uid=me) then raise exception '프로필을 먼저 설정하세요.'; end if;\n if jsonb_typeof(p_items)\u003c>'array' or jsonb_array_length(p_items)>100 then raise exception '잘못된 제출입니다.'; end if;\n perform pg_advisory_xact_lock(hashtextextended(me::text,0));\n if (select count(*) from kl1.attempts where uid=me and created_at>now()-interval '1 minute')+jsonb_array_length(p_items)>250 then raise exception '제출이 너무 빠릅니다. 잠시 후 동기화하세요.'; end if;\n for x in select value from jsonb_array_elements(p_items) loop\n  rid:=x->>'id'; if rid is null or rid !~ '^[0-9a-fA-F-]{36}$' then raise exception '기록 ID 오류'; end if;\n  select * into b from kl1.bank where id=x->>'qid'; if not found or not kl1.valid(b,x->'answer') then raise exception '문항 또는 답안 오류'; end if;\n  insert into kl1.attempts(uid,id,qid,answer,ok,unsure,source) values(me,rid,b.id,x->'answer',kl1.is_correct(b,x->'answer'),coalesce((x->>'unsure')::boolean,false),case when b.kind='exam' then 'review' else b.kind end) on conflict(uid,id) do nothing;\n  n:=n+1;\n end loop;\n return jsonb_build_object('processed',n);\nend $$;\ncreate or replace function public.kl1_exam(p_id text,p_form integer,p_items jsonb) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); x jsonb; b kl1.bank%rowtype; sc integer:=0; rc integer:=0; v_ok boolean; seen text[]:=array[]::text[];\nbegin\n if me is null or not exists(select 1 from kl1.profiles where uid=me) then raise exception '프로필을 먼저 설정하세요.'; end if;\n if p_id is null or p_id !~ '^[0-9a-fA-F-]{36}$' or p_form is null or p_form not between 1 and 8 or jsonb_typeof(p_items)\u003c>'array' or jsonb_array_length(p_items)>25 then raise exception '시험 제출 오류'; end if;\n perform pg_advisory_xact_lock(hashtextextended(me::text,0));\n if exists(select 1 from kl1.exam_runs where uid=me and id=p_id) then return jsonb_build_object('duplicate',true); end if;\n if (select count(*) from kl1.bank where kind='exam' and form=p_form)\u003c>25 then raise exception '시험 문제은행 설치를 확인하세요.'; end if;\n if (select count(*) from kl1.attempts where uid=me and created_at>now()-interval '1 minute')+jsonb_array_length(p_items)>250 then raise exception '제출이 너무 빠릅니다. 잠시 후 동기화하세요.'; end if;\n for x in select value from jsonb_array_elements(p_items) loop\n  select * into b from kl1.bank where id=x->>'qid' and kind='exam' and form=p_form;\n  if not found or b.id=any(seen) or not kl1.valid(b,x->'answer') then raise exception '시험 문항 또는 답안 오류'; end if;\n  seen:=array_append(seen,b.id);v_ok:=kl1.is_correct(b,x->'answer'); if v_ok then sc:=sc+b.points;rc:=rc+1;end if;\n  insert into kl1.attempts(uid,id,qid,answer,ok,unsure,source,exam_id) values(me,p_id||':'||b.id,b.id,x->'answer',v_ok,coalesce((x->>'unsure')::boolean,false),'exam',p_id);\n end loop;\n insert into kl1.exam_runs(uid,id,form,score,right_n) values(me,p_id,p_form,sc,rc);\n return jsonb_build_object('score',sc,'right',rc);\nend $$;\nrevoke all on function public.kl1_record(jsonb),public.kl1_exam(text,integer,jsonb) from public,anon;\ngrant execute on function public.kl1_record(jsonb),public.kl1_exam(text,integer,jsonb) to authenticated;"},{"title":"집계·개인 통계","sql":"create or replace function kl1.stats_for(p_uid uuid,p_since timestamptz default null) returns jsonb language sql stable set search_path=pg_catalog,public as $$\n with a as (select a.*,b.level from kl1.attempts a join kl1.bank b on b.id=a.qid where a.uid=p_uid and (p_since is null or a.created_at>=p_since)),\n agg as (select count(*) n,count(*) filter(where ok) rn,count(distinct qid) uniq,count(*) filter(where level in ('고난도','최고난도')) hi,count(*) filter(where ok and level in ('고난도','최고난도')) hr,count(distinct qid) filter(where ok and level='최고난도') top_n,count(distinct qid) filter(where ok) xpq from a),\n first_runs as (select distinct on(form) form,score,created_at from kl1.exam_runs where uid=p_uid order by form,created_at,id),\n ea as (select count(*) ec,avg(score*100.0/82) ea from first_runs where p_since is null or created_at>=p_since)\n select jsonb_build_object('n',n,'right',rn,'unique',uniq,'high',hi,'hr',hr,'topUnique',top_n,'xp',xpq*10+(n/10)*2,'examCount',ec,'examAvg',round(ea,2)) from agg cross join ea;\n $$;\ncreate or replace function public.kl1_me() returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); pr jsonb; rec jsonb; exams jsonb; grps jsonb;\nbegin\n if me is null then raise exception '로그인이 필요합니다.'; end if;\n select to_jsonb(p)-'uid' into pr from kl1.profiles p where p.uid=me;\n select coalesce(jsonb_agg(to_jsonb(t) order by t.\"at\"),'[]'::jsonb) into rec from (select a.id,a.qid,a.answer as a,a.ok,a.unsure,a.exam_id as \"examId\",extract(epoch from a.created_at)*1000 as \"at\" from kl1.attempts a where a.uid=me order by a.created_at desc limit 5000)t;\n select coalesce(jsonb_agg(to_jsonb(t) order by t.\"at\"),'[]'::jsonb) into exams from (select id,form,score,right_n as \"right\",extract(epoch from created_at)*1000 as \"at\" from kl1.exam_runs where uid=me order by created_at desc limit 500)t;\n select coalesce(jsonb_agg(jsonb_build_object('id',g.id,'name',g.name,'code',g.code)),'[]'::jsonb) into grps from kl1.groups g join kl1.members m on m.group_id=g.id where m.uid=me;\n return jsonb_build_object('profile',pr,'stats',kl1.stats_for(me,null),'records',rec,'exams',exams,'groups',grps);\nend $$;\nrevoke all on function kl1.stats_for(uuid,timestamptz) from public,anon,authenticated;\nrevoke all on function public.kl1_me() from public,anon; grant execute on function public.kl1_me() to authenticated;"},{"title":"그룹 및 공동 랭킹","sql":"create or replace function public.kl1_group_create(p_name text) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); gid uuid; c text:=upper(substr(replace(gen_random_uuid()::text,'-',''),1,10));\nbegin\n if me is null or not exists(select 1 from kl1.profiles where uid=me) then raise exception '로그인과 프로필이 필요합니다.'; end if;\n if p_name is null or char_length(btrim(p_name)) not between 1 and 30 then raise exception '그룹 이름은 1~30자입니다.'; end if;\n if (select count(*) from kl1.groups where owner_uid=me)>=10 then raise exception '그룹 생성 한도에 도달했습니다.'; end if;\n insert into kl1.groups(name,code,owner_uid) values(btrim(p_name),c,me) returning id into gid;\n insert into kl1.members(group_id,uid) values(gid,me);return jsonb_build_object('id',gid,'code',c);\nend $$;\ncreate or replace function public.kl1_group_join(p_code text) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); gid uuid;\nbegin\n if me is null or not exists(select 1 from kl1.profiles where uid=me) then raise exception '로그인과 프로필이 필요합니다.'; end if;\n select id into gid from kl1.groups where code=upper(btrim(p_code));if gid is null then raise exception '초대 코드를 확인하세요.'; end if;\n insert into kl1.members(group_id,uid) values(gid,me) on conflict do nothing;return jsonb_build_object('ok',true);\nend $$;\ncreate or replace function public.kl1_group_leave(p_group uuid) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\nbegin if auth.uid() is null then raise exception '로그인이 필요합니다.';end if;delete from kl1.members where group_id=p_group and uid=auth.uid();return jsonb_build_object('ok',true);end $$;\ncreate or replace function public.kl1_board(p_period text default 'all',p_group uuid default null) returns jsonb language plpgsql security definer set search_path=pg_catalog,public as $$\ndeclare me uuid:=auth.uid(); since_at timestamptz; out_rows jsonb;\nbegin\n if me is null then raise exception '로그인이 필요합니다.'; end if;\n if p_period not in ('all','month') then raise exception '랭킹 기간 오류';end if;\n if p_group is not null and not exists(select 1 from kl1.members where group_id=p_group and uid=me) then raise exception '그룹 멤버만 조회할 수 있습니다.'; end if;\n if p_period='month' then since_at:=date_trunc('month',now() at time zone 'Asia/Seoul') at time zone 'Asia/Seoul';end if;\n select coalesce(jsonb_agg(kl1.stats_for(p.uid,since_at)||jsonb_build_object('uid',p.uid,'nickname',p.nickname,'avatar',p.avatar,'title',p.title)),'[]'::jsonb) into out_rows from kl1.profiles p where p_group is null or exists(select 1 from kl1.members m where m.group_id=p_group and m.uid=p.uid);\n return out_rows;\nend $$;\nrevoke all on function public.kl1_group_create(text),public.kl1_group_join(text),public.kl1_group_leave(uuid),public.kl1_board(text,uuid) from public,anon;\ngrant execute on function public.kl1_group_create(text),public.kl1_group_join(text),public.kl1_group_leave(uuid),public.kl1_board(text,uuid) to authenticated;\nnotify pgrst,'reload schema';"},{"title":"설치 결과 확인","sql":"select count(*) as total_auto, count(*) filter(where kind='practice') as practice, count(*) filter(where kind='exam') as exam, count(*) filter(where kind='drill') as drill, (select count(*) from information_schema.tables where table_schema='kl1' and table_type='BASE TABLE') as tables from kl1.bank;\n-- 예상 결과: 650 / 360 / 200 / 90 / 6"}]</script><script>'use strict';
